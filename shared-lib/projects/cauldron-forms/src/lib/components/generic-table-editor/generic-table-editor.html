<div class="table-editor-dialog" role="dialog" aria-labelledby="table-editor-title">
  <h2 mat-dialog-title id="table-editor-title">{{ title }}</h2>

  <mat-dialog-content>
    <div class="toolbar" role="toolbar" aria-label="Table actions">
      <button mat-raised-button color="primary" (click)="addRow()" aria-label="Add new row to table">
        <mat-icon aria-hidden="true">add</mat-icon>
        Add Row
      </button>
      <button mat-raised-button (click)="importFromFile()" aria-label="Import data from file">
        <mat-icon aria-hidden="true">upload</mat-icon>
        Import
      </button>
      <button mat-raised-button (click)="exportToFile()" aria-label="Export data to file">
        <mat-icon aria-hidden="true">download</mat-icon>
        Export
      </button>
    </div>

    <div class="table-container">
      <table mat-table [dataSource]="pagedData" class="full-width-table" aria-label="Editable data table">
        <ng-container *ngFor="let column of columns" [matColumnDef]="column.name">
          <th mat-header-cell *matHeaderCellDef scope="col">
            {{ column.label }}
            <span *ngIf="column.required" class="required-indicator" aria-label="required">*</span>
            <mat-icon *ngIf="column.description"
                      class="info-icon"
                      [matTooltip]="column.description"
                      aria-hidden="true">
              info
            </mat-icon>
          </th>
          <td mat-cell *matCellDef="let element">
            <mat-form-field appearance="outline" class="table-input">
              <input matInput
                     [(ngModel)]="element[column.name]"
                     [type]="column.type || 'text'"
                     [required]="!!column.required"
                     [attr.aria-required]="column.required || null"
                     [attr.aria-label]="column.label"
                     [placeholder]="column.label">
            </mat-form-field>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef scope="col">Actions</th>
          <td mat-cell *matCellDef="let element; let i = index">
            <button mat-icon-button
                    (click)="duplicateRow(i)"
                    matTooltip="Duplicate row"
                    [attr.aria-label]="'Duplicate row ' + (pageIndex * pageSize + i + 1)">
              <mat-icon aria-hidden="true">content_copy</mat-icon>
            </button>
            <button mat-icon-button
                    color="warn"
                    (click)="deleteRow(i)"
                    matTooltip="Delete row"
                    [attr.aria-label]="'Delete row ' + (pageIndex * pageSize + i + 1)">
              <mat-icon aria-hidden="true">delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <mat-paginator
      [length]="totalRows"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25, 50]"
      [pageIndex]="pageIndex"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>

    <div class="info-section">
      <p class="row-count" aria-live="polite">Total rows: {{ totalRows }}</p>
      <p *ngIf="!isValid()" class="error-message" role="alert" aria-live="assertive">
        <mat-icon aria-hidden="true">warning</mat-icon>
        Please fill in all required fields (marked with *)
      </p>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="cancel()" aria-label="Cancel and close dialog">Cancel</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="!isValid()" aria-label="Save table data">
      Save
    </button>
  </mat-dialog-actions>
</div>
