<div class="table-editor-dialog">
  <h2 mat-dialog-title>{{ title }}</h2>

  <mat-dialog-content>
    <div class="toolbar">
      <button mat-raised-button color="primary" (click)="addRow()">
        <mat-icon>add</mat-icon>
        Add Row
      </button>
      <button mat-raised-button (click)="importFromFile()">
        <mat-icon>upload</mat-icon>
        Import
      </button>
      <button mat-raised-button (click)="exportToFile()">
        <mat-icon>download</mat-icon>
        Export
      </button>
    </div>

    <div class="table-container">
      <table mat-table [dataSource]="pagedData" class="full-width-table">
        <ng-container *ngFor="let column of columns" [matColumnDef]="column.name">
          <th mat-header-cell *matHeaderCellDef>
            {{ column.label }}
            <span *ngIf="column.required" class="required-indicator">*</span>
            <mat-icon *ngIf="column.description"
                      class="info-icon"
                      [matTooltip]="column.description">
              info
            </mat-icon>
          </th>
          <td mat-cell *matCellDef="let element">
            <mat-form-field appearance="outline" class="table-input">
              <input matInput
                     [(ngModel)]="element[column.name]"
                     [type]="column.type || 'text'"
                     [required]="!!column.required"
                     [placeholder]="column.label">
            </mat-form-field>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element; let i = index">
            <button mat-icon-button
                    (click)="duplicateRow(i)"
                    matTooltip="Duplicate row">
              <mat-icon>content_copy</mat-icon>
            </button>
            <button mat-icon-button
                    color="warn"
                    (click)="deleteRow(i)"
                    matTooltip="Delete row">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <mat-paginator
      [length]="totalRows"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25, 50]"
      [pageIndex]="pageIndex"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>

    <div class="info-section">
      <p class="row-count">Total rows: {{ totalRows }}</p>
      <p *ngIf="!isValid()" class="error-message">
        <mat-icon>warning</mat-icon>
        Please fill in all required fields (marked with *)
      </p>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="!isValid()">
      Save
    </button>
  </mat-dialog-actions>
</div>
