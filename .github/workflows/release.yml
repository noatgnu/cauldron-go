name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make build.sh executable
        run: chmod +x build.sh
        shell: bash

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup R Environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin/win/R-Portable"
          Invoke-WebRequest -Uri https://cran.r-project.org/bin/windows/base/old/4.5.2/R-4.5.2-win.exe -OutFile R-Installer.exe
          Start-Process -FilePath R-Installer.exe -ArgumentList "/VERYSILENT", "/DIR=${{ github.workspace }}/bin/win/R-Portable" -Wait
          echo "${{ github.workspace }}/bin/win/R-Portable/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "R_HOME=${{ github.workspace }}/bin/win/R-Portable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install R packages
        shell: pwsh
        env:
          R_LIBS_USER: ${{ github.workspace }}/bin/win/R-Portable/library
        run: |
          & "${{ github.workspace }}/bin/win/R-Portable/bin/Rscript.exe" backend/scripts/r/install_packages.R

      - name: Setup Python Environment
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-x86_64-pc-windows-msvc-shared-install_only.tar.gz -OutFile python-standalone.tar.gz
          New-Item -ItemType Directory -Force -Path "bin/win/python"
          tar -xzf python-standalone.tar.gz -C "bin/win"
          echo "${{ github.workspace }}/bin/win/python" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
      - name: Install Python packages
        shell: pwsh
        run: |
          & "${{ github.workspace }}/bin/win/python/python.exe" -m pip install --upgrade pip
          & "${{ github.workspace }}/bin/win/python/python.exe" -m pip install -r scripts/requirements.txt

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
        shell: bash

      - name: Build Developer Tools
        run: ./build.sh tools
        shell: bash

      - name: Build External Tools
        run: ./build.sh external windows/amd64
        shell: bash

      - name: Validate Plugins
        run: |
          echo "Validating all plugins before release..."
          ./bin/windows-amd64/plugin-validator.exe plugins/
          if [ $? -ne 0 ]; then
            echo "::error::Plugin validation failed - cannot create release"
            exit 1
          fi
          echo "::notice::All plugins validated successfully"
        shell: bash

      - name: Create dummy frontend dist for embedding
        run: |
          mkdir -p frontend/dist/browser
          echo "placeholder" > frontend/dist/browser/index.html
        shell: bash

      - name: Create dummy license files for embedding
        run: |
          mkdir -p resources/licenses
          echo "[]" > resources/licenses/go-licenses.json
          echo "[]" > resources/licenses/npm-licenses.json
        shell: bash

      - name: Run Backend Tests
        run: go test -v ./backend/... ./cmd/...
        shell: bash

      - name: Run E2E Tests (no plugins required)
        run: |
          go test -v -run "TestE2ESettingsManagement|TestE2EEnvironmentDetection|TestE2EFileOperations|TestE2EVersionChecks|TestE2ELogging|TestE2ETempFileOperations|TestE2EDefaultVenvPath|TestE2EJobQueueAdvanced|TestE2EPluginManagement" -timeout 120s
        shell: bash

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts
        shell: bash

      - name: Build shared-lib
        run: |
          cd shared-lib
          npm install
          npm run build
          cd ..
        shell: bash

      - name: Generate Licenses
        run: |
          node scripts/generate-go-licenses.js
          cd frontend && npm install --silent && cd ..
          node scripts/generate-npm-licenses.js
        shell: bash

      - name: Prepare Icons
        run: |
          mkdir -p build/windows
          cp resources/appicon.png build/appicon.png
          cp resources/icon.ico build/windows/icon.ico
        shell: bash

      - name: Build Application
        run: |
          cd frontend
          npm run build
          cd ..
          wails3 build --platform windows/amd64
        shell: bash

      - name: Copy Resources
        run: |
          cp -r examples build/bin/
          cp -r scripts build/bin/
          cp -r plugins build/bin/
          mkdir -p build/bin/tools
          if [ -f bin/plugin-validator.exe ]; then cp bin/plugin-validator.exe build/bin/tools/; fi
          if [ -f bin/plugin-doc-generator.exe ]; then cp bin/plugin-doc-generator.exe build/bin/tools/; fi
          if [ -f bin/plugin-doc-generator-all.exe ]; then cp bin/plugin-doc-generator-all.exe build/bin/tools/; fi
          if [ -f bin/plugin-scaffolder.exe ]; then cp bin/plugin-scaffolder.exe build/bin/tools/; fi
          if [ -f bin/plugin-to-nextflow.exe ]; then cp bin/plugin-to-nextflow.exe build/bin/tools/; fi
          if [ -d bin/external ]; then cp -r bin/external build/bin/tools/; fi
        shell: bash

      - name: Check archive size before compression
        run: |
          du -sh build/bin/ || echo "du not available, using dir"
          if ! command -v du &> /dev/null; then dir build/bin; fi
        shell: bash

      - name: Create Archive
        run: |
          cd build/bin
          7z a ../../cauldron-windows-amd64.zip cauldron.exe examples/ scripts/ plugins/ tools/
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cauldron-windows-amd64
          path: cauldron-windows-amd64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev \
            gfortran \
            libpng-dev \
            libjpeg-dev \
            liblzma-dev \
            libpcre2-dev \
            libcurl4-openssl-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libcairo2-dev \
            tcl-dev \
            tk-dev \
            libhdf5-dev \
            libblosc-dev \
            libhiredis-dev \
            libopenmpi-dev \
            liblzo2-dev \
            libomp-dev \
            libreadline-dev \
            bzip2 \
            python3-venv

      - name: Compile R
        run: |
          curl -O https://cran.r-project.org/src/base/R-4/R-4.5.2.tar.gz
          tar -xzvf R-4.5.2.tar.gz
          cd R-4.5.2
          CPPFLAGS="-I/usr/include -I/usr/include/xorg" \
          LDFLAGS="-L/usr/lib -L/usr/lib/xorg" \
          CFLAGS="-I/usr/include" \
          TCL_LIBRARY="/usr/lib/tcltk" \
          TK_LIBRARY="/usr/lib/tcltk" \
          PKG_CONFIG_PATH="/usr/lib/pkgconfig" \
          C_INCLUDE_PATH="/usr/include" \
          LIBRARY_PATH="/usr/lib" \
          ./configure --prefix=${{ github.workspace }}/R --enable-R-shlib --with-blas --with-lapack --with-tcltk --with-mpi
          make -j$(nproc)
          make install

      - name: Set R environment variables
        run: |
          echo "${{ github.workspace }}/R/bin" >> $GITHUB_PATH
          echo "R_HOME=${{ github.workspace }}/R" >> $GITHUB_ENV
          echo "R_LIBS_USER=${{ github.workspace }}/R_libs" >> $GITHUB_ENV
          mkdir -p "${{ github.workspace }}/R_libs"

      - name: Download Portable Python
        run: |
          curl -LO https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz

      - name: Extract Python
        run: |
          mkdir -p "${{ github.workspace }}/python"
          tar -xzf cpython-3.11.10+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz -C "${{ github.workspace }}/python" --no-same-owner --no-same-permissions
          echo "${{ github.workspace }}/python/bin" >> $GITHUB_PATH


      - name: Install dependencies
        run: |
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Link WebKitGTK 4.0 for pkg-config
        run: |
          PC_FILE=$(find /usr -name "webkit2gtk-4.1.pc" 2>/dev/null | head -n 1)
          if [ -z "$PC_FILE" ]; then
            echo "::error::webkit2gtk-4.1.pc not found!"
            exit 1
          fi
          echo "Found webkit2gtk-4.1.pc at ${PC_FILE}"
          sudo ln -s "$PC_FILE" /usr/share/pkgconfig/webkit2gtk-4.0.pc
          echo "Symlink created. Verifying with pkg-config:"
          pkg-config --modversion webkit2gtk-4.0


      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build Developer Tools
        run: ./build.sh tools

      - name: Build External Tools
        run: ./build.sh external linux/amd64

      - name: Validate Plugins
        run: |
          echo "Validating all plugins before release..."
          ./bin/linux-amd64/plugin-validator plugins/
          if [ $? -ne 0 ]; then
            echo "::error::Plugin validation failed - cannot create release"
            exit 1
          fi
          echo "::notice::All plugins validated successfully"

      - name: Create dummy frontend dist for embedding
        run: |
          mkdir -p frontend/dist/browser
          echo "placeholder" > frontend/dist/browser/index.html

      - name: Create dummy license files for embedding
        run: |
          mkdir -p resources/licenses
          echo "[]" > resources/licenses/go-licenses.json
          echo "[]" > resources/licenses/npm-licenses.json

      - name: Run Backend Tests
        run: go test -v ./backend/... ./cmd/...

      - name: Run E2E Tests (no plugins required)
        run: |
          go test -v -run "TestE2ESettingsManagement|TestE2EEnvironmentDetection|TestE2EFileOperations|TestE2EVersionChecks|TestE2ELogging|TestE2ETempFileOperations|TestE2EDefaultVenvPath|TestE2EJobQueueAdvanced|TestE2EPluginManagement" -timeout 120s

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts

      - name: Build shared-lib
        run: |
          cd shared-lib
          npm install
          npm run build

      - name: Generate Licenses
        run: |
          node scripts/generate-go-licenses.js
          cd frontend && npm install --silent && cd ..
          node scripts/generate-npm-licenses.js

      - name: Prepare Icons
        run: |
          mkdir -p build
          cp resources/appicon.png build/appicon.png

      - name: Build Application
        run: |
          cd frontend
          npm run build
          cd ..
          wails3 build --platform linux/amd64

      - name: Clean up test environments
        run: |
          rm -rf R python R-4.5.2 R-4.5.2.tar.gz cpython*.tar.gz

      - name: Copy Resources
        run: |
          cp -r examples build/bin/
          cp -r scripts build/bin/
          cp -r plugins build/bin/
          mkdir -p build/bin/tools
          if [ -f bin/plugin-validator ]; then cp bin/plugin-validator build/bin/tools/; fi
          if [ -f bin/plugin-doc-generator ]; then cp bin/plugin-doc-generator build/bin/tools/; fi
          if [ -f bin/plugin-doc-generator-all ]; then cp bin/plugin-doc-generator-all build/bin/tools/; fi
          if [ -f bin/plugin-scaffolder ]; then cp bin/plugin-scaffolder build/bin/tools/; fi
          if [ -f bin/plugin-to-nextflow ]; then cp bin/plugin-to-nextflow build/bin/tools/; fi
          if [ -d bin/external ]; then cp -r bin/external build/bin/tools/; fi

      - name: Check archive size before compression
        run: |
          du -sh build/bin/

      - name: Create Archive
        run: |
          cd build/bin
          XZ_OPT=-9 tar -cJf ../../cauldron-linux-amd64.tar.xz cauldron examples/ scripts/ plugins/ tools/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cauldron-linux-amd64
          path: cauldron-linux-amd64.tar.xz


  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install --cask xquartz
          brew install gfortran pkg-config libpng jpeg xz pcre2 curl harfbuzz fribidi libx11 libxext libxrender libxtst cairo tcl-tk hdf5 c-blosc hiredis open-mpi lzo bzip2

      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Set up PATH
        run: |
          echo "$(brew --prefix gcc)/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/jpeg/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/open-mpi/bin" >> $GITHUB_PATH
          echo "$(brew --prefix hdf5)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix lzo)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix c-blosc)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix bzip2)/bin" >> $GITHUB_PATH

      - name: Compile R
        env:
          CPPFLAGS: -I/opt/homebrew/include -I/opt/X11/include -I/opt/homebrew/opt/jpeg/include -I/opt/homebrew/include
          LDFLAGS: -L/opt/X11/lib -L/opt/homebrew/opt/jpeg/lib -L/opt/homebrew/opt/lzo/lib -L/opt/homebrew/lib
          LZO_DIR: $(brew --prefix lzo)
          BZIP2_DIR: $(brew --prefix bzip2)
          BLOSC_DIR: $(brew --prefix c-blosc)
          HDF5_DIR: $(brew --prefix hdf5)
          CFLAGS: -I/opt/homebrew/opt/lzo/include
          TCL_LIBRARY: /opt/homebrew/opt/tcl-tk/lib
          TK_LIBRARY: /opt/homebrew/opt/tcl-tk/lib
          PKG_CONFIG_PATH: /opt/homebrew/opt/jpeg/lib/pkgconfig
          C_INCLUDE_PATH: /opt/homebrew/Cellar/lzo/2.10/include/lzo:/opt/homebrew/Cellar/lzo/2.10/include/
          LIBRARY_PATH: /opt/homebrew/lib
        run: |
          curl -O https://cran.r-project.org/src/base/R-4/R-4.5.2.tar.gz
          tar -xzvf R-4.5.2.tar.gz
          cd R-4.5.2
          ./configure --prefix=${{ github.workspace }}/R --enable-R-shlib --with-blas --with-lapack --with-tcltk --with-mpi
          make -j$(nproc)
          make install

      - name: Set R environment variables
        run: |
          echo "${{ github.workspace }}/R/bin" >> $GITHUB_PATH
          echo "R_HOME=${{ github.workspace }}/R" >> $GITHUB_ENV
          echo "R_LIBS_USER=${{ github.workspace }}/R_libs" >> $GITHUB_ENV
          mkdir -p "${{ github.workspace }}/R_libs"

      - name: Download Portable Python
        run: |
          curl -LO https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-aarch64-apple-darwin-install_only.tar.gz

      - name: Extract Python
        run: |
          mkdir -p "${{ github.workspace }}/python"
          tar -xzf cpython-3.11.10+20241016-aarch64-apple-darwin-install_only.tar.gz -C "${{ github.workspace }}/python" --no-same-owner --no-same-permissions
          echo "${{ github.workspace }}/python/bin" >> $GITHUB_PATH

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build Developer Tools
        run: ./build.sh tools

      - name: Build External Tools
        run: ./build.sh external darwin/arm64

      - name: Validate Plugins
        run: |
          echo "Validating all plugins before release..."
          ./bin/darwin-arm64/plugin-validator plugins/
          if [ $? -ne 0 ]; then
            echo "::error::Plugin validation failed - cannot create release"
            exit 1
          fi
          echo "::notice::All plugins validated successfully"

      - name: Create dummy frontend dist for embedding
        run: |
          mkdir -p frontend/dist/browser
          echo "placeholder" > frontend/dist/browser/index.html

      - name: Create dummy license files for embedding
        run: |
          mkdir -p resources/licenses
          echo "[]" > resources/licenses/go-licenses.json
          echo "[]" > resources/licenses/npm-licenses.json

      - name: Run Backend Tests
        run: go test -v ./backend/... ./cmd/...

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts

      - name: Build shared-lib
        run: |
          cd shared-lib
          npm install
          npm run build

      - name: Generate Licenses
        run: |
          node scripts/generate-go-licenses.js
          cd frontend && npm install --silent && cd ..
          node scripts/generate-npm-licenses.js

      - name: Prepare Icons
        run: |
          mkdir -p build
          cp resources/appicon.png build/appicon.png

      - name: Build Application
        run: |
          cd frontend
          npm run build
          cd ..
          wails3 build --platform darwin/arm64

      - name: Verify Build
        run: ls -l build/bin/

      - name: Clean up test environments
        run: |
          rm -rf R python R-4.5.2 R-4.5.2.tar.gz cpython*.tar.gz

      - name: Copy Resources
        run: |
          cp -r examples build/bin/
          cp -r scripts build/bin/
          cp -r plugins build/bin/
          mkdir -p build/bin/tools
          if [ -f bin/plugin-validator ]; then cp bin/plugin-validator build/bin/tools/; fi
          if [ -f bin/plugin-doc-generator ]; then cp bin/plugin-doc-generator build/bin/tools/; fi
          if [ -f bin/plugin-doc-generator-all ]; then cp bin/plugin-doc-generator-all build/bin/tools/; fi
          if [ -f bin/plugin-scaffolder ]; then cp bin/plugin-scaffolder build/bin/tools/; fi
          if [ -f bin/plugin-to-nextflow ]; then cp bin/plugin-to-nextflow build/bin/tools/; fi
          if [ -d bin/external ]; then cp -r bin/external build/bin/tools/; fi

      - name: Check archive size before compression
        run: |
          du -sh build/bin/

      - name: Create Archive
        run: |
          cd build/bin
          XZ_OPT=-9 tar -cJf ../../cauldron-darwin-arm64.tar.xz cauldron-go.app examples/ scripts/ plugins/ tools/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cauldron-darwin-arm64
          path: cauldron-darwin-arm64.tar.xz

  create-release:
    needs: [build-windows, build-linux, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            cauldron-windows-amd64/cauldron-windows-amd64.zip
            cauldron-linux-amd64/cauldron-linux-amd64.tar.xz
            cauldron-darwin-arm64/cauldron-darwin-arm64.tar.xz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
