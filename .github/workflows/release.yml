name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make build.sh executable
        run: chmod +x build.sh
        shell: bash

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Environment for Testing
        shell: pwsh
        run: |
          echo "Setting up portable Python and R for testing..."
          Invoke-WebRequest -Uri https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-x86_64-pc-windows-msvc-shared-install_only.tar.gz -OutFile python-standalone.tar.gz
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/python"
          tar -xzf python-standalone.tar.gz -C "${{ github.workspace }}/python"
          echo "${{ github.workspace }}/python/python" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Invoke-WebRequest -Uri https://cran.r-project.org/bin/windows/base/old/4.5.1/R-4.5.1-win.exe -OutFile R-Installer.exe
          Start-Process -FilePath R-Installer.exe -ArgumentList "/VERYSILENT", "/DIR=${{ github.workspace }}/R" -Wait
          echo "${{ github.workspace }}/R/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "R_HOME=${{ github.workspace }}/R" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
        shell: bash

      - name: Build Developer Tools
        run: ./build.sh tools
        shell: bash

      - name: Build External Tools
        run: ./build.sh external windows/amd64
        shell: bash

      - name: Validate Plugins
        run: |
          echo "Validating all plugins before release..."
          ./bin/plugin-validator.exe plugins/
          if [ $? -ne 0 ]; then
            echo "::error::Plugin validation failed - cannot create release"
            exit 1
          fi
          echo "::notice::All plugins validated successfully"
        shell: bash

      - name: Run Backend Tests
        run: go test -v ./backend/... ./cmd/...
        shell: bash

      - name: Build Application
        run: |
          cd frontend
          npm install
          npm run build
          cd ..
          wails build -platform windows/amd64
        shell: bash

      - name: Copy Resources
        run: |
          cp -r examples build/bin/
          cp -r scripts build/bin/
          cp -r plugins build/bin/
          mkdir -p build/bin/tools
          cp -r bin/* build/bin/tools/
        shell: bash

      - name: Create Archive
        run: |
          cd build/bin
          7z a ../../cauldron-windows-amd64.zip cauldron.exe examples/ scripts/ plugins/ tools/
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cauldron-windows-amd64
          path: cauldron-windows-amd64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Environment for Testing
        run: |
          echo "Setting up portable Python and R for testing..."
          mkdir -p "${{ github.workspace }}/python"
          curl -sL "https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz" | tar -xzf - -C "${{ github.workspace }}/python"
          echo "${{ github.workspace }}/python/bin" >> $GITHUB_PATH

          sudo apt-get update
          sudo apt-get install -y r-base python3-venv
          echo "R_HOME=/usr/lib/R" >> $GITHUB_ENV # Assuming default R location after apt-get
          echo "R_LIBS_USER=${{ github.workspace }}/R_libs" >> $GITHUB_ENV # Custom lib path for renv
          mkdir -p "${{ github.workspace }}/R_libs"

      - name: Install dependencies
        run: |
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Link WebKitGTK 4.0 for pkg-config
        run: |
          PC_FILE=$(find /usr -name "webkit2gtk-4.1.pc" 2>/dev/null | head -n 1)
          if [ -z "$PC_FILE" ]; then
            echo "::error::webkit2gtk-4.1.pc not found!"
            exit 1
          fi
          echo "Found webkit2gtk-4.1.pc at ${PC_FILE}"
          sudo ln -s "$PC_FILE" /usr/share/pkgconfig/webkit2gtk-4.0.pc
          echo "Symlink created. Verifying with pkg-config:"
          pkg-config --modversion webkit2gtk-4.0


      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Developer Tools
        run: ./build.sh tools

      - name: Build External Tools
        run: ./build.sh external linux/amd64

      - name: Validate Plugins
        run: |
          echo "Validating all plugins before release..."
          ./bin/plugin-validator plugins/
          if [ $? -ne 0 ]; then
            echo "::error::Plugin validation failed - cannot create release"
            exit 1
          fi
          echo "::notice::All plugins validated successfully"

      - name: Run Backend Tests
        run: go test -v ./backend/... ./cmd/...

      - name: Build Application
        run: |
          cd frontend
          npm install
          npm run build
          cd ..
          wails build -platform linux/amd64

      - name: Copy Resources
        run: |
          cp -r examples build/bin/
          cp -r scripts build/bin/
          cp -r plugins build/bin/
          mkdir -p build/bin/tools
          cp -r bin/* build/bin/tools/

      - name: Create Archive
        run: |
          cd build/bin
          XZ_OPT=-9 tar -cJf ../../cauldron-linux-amd64.tar.xz cauldron examples/ scripts/ plugins/ tools/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cauldron-linux-amd64
          path: cauldron-linux-amd64.tar.xz

  build-macos-intel:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Environment for Testing
        run: |
          echo "Setting up portable Python and R for testing..."
          mkdir -p "${{ github.workspace }}/python"
          curl -sL "https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-x86_64-apple-darwin-install_only.tar.gz" | tar -xzf - -C "${{ github.workspace }}/python"
          echo "${{ github.workspace }}/python/bin" >> $GITHUB_PATH

          brew install r
          echo "/usr/local/opt/r/bin" >> $GITHUB_PATH # Assuming default brew R location
          echo "R_HOME=/usr/local/opt/r/lib/R" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "R_LIBS_USER=${{ github.workspace }}/R_libs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          mkdir -p "${{ github.workspace }}/R_libs"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Developer Tools
        run: ./build.sh tools

      - name: Build External Tools
        run: ./build.sh external darwin/amd64

      - name: Validate Plugins
        run: |
          echo "Validating all plugins before release..."
          ./bin/plugin-validator plugins/
          if [ $? -ne 0 ]; then
            echo "::error::Plugin validation failed - cannot create release"
            exit 1
          fi
          echo "::notice::All plugins validated successfully"

      - name: Run Backend Tests
        run: go test -v ./backend/... ./cmd/...

      - name: Build Application
        run: wails build -platform darwin/amd64

      - name: Verify Build
        run: ls -l build/bin/

      - name: Copy Resources
        run: |
          cp -r examples build/bin/
          cp -r scripts build/bin/
          cp -r plugins build/bin/
          mkdir -p build/bin/tools
          cp -r bin/* build/bin/tools/

      - name: Create Archive
        run: |
          cd build/bin
          XZ_OPT=-9 tar -cJf ../../cauldron-darwin-amd64.tar.xz cauldron-go.app examples/ scripts/ plugins/ tools/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cauldron-darwin-amd64
          path: cauldron-darwin-amd64.tar.xz

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Environment for Testing
        run: |
          echo "Setting up portable Python and R for testing..."
          mkdir -p "${{ github.workspace }}/python"
          curl -sL "https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-aarch64-apple-darwin-install_only.tar.gz" | tar -xzf - -C "${{ github.workspace }}/python"
          echo "${{ github.workspace }}/python/bin" >> $GITHUB_PATH

          brew install r
          echo "/opt/homebrew/opt/r/bin" >> $GITHUB_PATH # Assuming default brew R location for arm64
          echo "R_HOME=/opt/homebrew/opt/r/lib/R" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "R_LIBS_USER=${{ github.workspace }}/R_libs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          mkdir -p "${{ github.workspace }}/R_libs"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Developer Tools
        run: ./build.sh tools

      - name: Build External Tools
        run: ./build.sh external darwin/arm64

      - name: Validate Plugins
        run: |
          echo "Validating all plugins before release..."
          ./bin/plugin-validator plugins/
          if [ $? -ne 0 ]; then
            echo "::error::Plugin validation failed - cannot create release"
            exit 1
          fi
          echo "::notice::All plugins validated successfully"

      - name: Run Backend Tests
        run: go test -v ./backend/... ./cmd/...

      - name: Build Application
        run: wails build -platform darwin/arm64

      - name: Verify Build
        run: ls -l build/bin/

      - name: Copy Resources
        run: |
          cp -r examples build/bin/
          cp -r scripts build/bin/
          cp -r plugins build/bin/
          mkdir -p build/bin/tools
          cp -r bin/* build/bin/tools/

      - name: Create Archive
        run: |
          cd build/bin
          XZ_OPT=-9 tar -cJf ../../cauldron-darwin-arm64.tar.xz cauldron-go.app examples/ scripts/ plugins/ tools/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cauldron-darwin-arm64
          path: cauldron-darwin-arm64.tar.xz

  create-release:
    needs: [build-windows, build-linux, build-macos-intel, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            cauldron-windows-amd64/cauldron-windows-amd64.zip
            cauldron-linux-amd64/cauldron-linux-amd64.tar.xz
            cauldron-darwin-amd64/cauldron-darwin-amd64.tar.xz
            cauldron-darwin-arm64/cauldron-darwin-arm64.tar.xz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
