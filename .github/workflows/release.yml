name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make build.sh executable
        run: chmod +x build.sh
        shell: bash

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Setup R Environment via cooker (downloads the tested, genuinely relocatable r-portable build instead of the CRAN installer)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/noatgnu/cookeR/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $assetUrl = ($release.assets | Where-Object { $_.name -like "*windows-x86_64.exe" }).browser_download_url
          Invoke-WebRequest -Uri $assetUrl -OutFile cooker.exe
          $available = & .\cooker.exe r list --available --json | ConvertFrom-Json
          $rVersion = $available[0].version
          New-Item -ItemType Directory -Force -Path bin/win | Out-Null
          $env:COOKER_INSTALL_DIR = "${{ github.workspace }}/bin/win"
          & .\cooker.exe r install $rVersion
          Move-Item -Path "bin/win/$rVersion" -Destination "bin/win/R-Portable"
          echo "${{ github.workspace }}/bin/win/R-Portable/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "R_HOME=${{ github.workspace }}/bin/win/R-Portable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python Environment
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-x86_64-pc-windows-msvc-shared-install_only.tar.gz -OutFile python-standalone.tar.gz
          New-Item -ItemType Directory -Force -Path "bin/win/python"
          tar -xzf python-standalone.tar.gz -C "bin/win"
          echo "${{ github.workspace }}/bin/win/python" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.15
        shell: bash

      - name: Build Developer Tools
        run: ./build.sh tools
        shell: bash

      - name: Build External Tools
        run: ./build.sh external windows/amd64
        shell: bash

      - name: Validate Plugins
        run: |
          echo "Validating all plugins before release..."
          ./bin/windows-amd64/plugin-validator.exe plugins/
          if [ $? -ne 0 ]; then
            echo "::error::Plugin validation failed - cannot create release"
            exit 1
          fi
          echo "::notice::All plugins validated successfully"
        shell: bash

      - name: Create dummy frontend dist for embedding
        run: |
          mkdir -p frontend/dist/browser
          echo "placeholder" > frontend/dist/browser/index.html
        shell: bash

      - name: Create dummy license files for embedding
        run: |
          mkdir -p resources/licenses
          echo "[]" > resources/licenses/go-licenses.json
          echo "[]" > resources/licenses/npm-licenses.json
        shell: bash

      - name: Run Backend Tests
        run: go test -v -short ./backend/... ./cmd/...
        shell: bash

      - name: Run E2E Tests (no plugins required)
        run: |
          go test -v -run "TestE2ESettingsManagement|TestE2EEnvironmentDetection|TestE2EFileOperations|TestE2EVersionChecks|TestE2ELogging|TestE2ETempFileOperations|TestE2EDefaultVenvPath|TestE2EJobQueueAdvanced|TestE2EPluginManagement" -timeout 120s
        shell: bash

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts
        shell: bash

      - name: Build shared-lib
        run: |
          cd shared-lib
          npm install
          npm run build
          cd ..
        shell: bash

      - name: Generate Licenses
        run: |
          node scripts/generate-go-licenses.js
          cd frontend
          rm -f package-lock.json
          npm install
          cd ..
          node scripts/generate-npm-licenses.js
        shell: bash

      - name: Prepare Icons
        run: |
          mkdir -p build/windows
          cp resources/appicon.png build/appicon.png
          cp resources/icon.ico build/windows/icon.ico
        shell: bash

      - name: Build Application
        run: |
          cd frontend
          npm run build
          cd ..
          mkdir -p build/bin/windows-amd64
          CGO_ENABLED=0 go build -ldflags="-s -w -H windowsgui" -o build/bin/windows-amd64/cauldron.exe .
        shell: bash

      - name: Copy Resources
        run: |
          cp -r examples build/bin/windows-amd64/
          cp -r scripts build/bin/windows-amd64/
          cp -r plugins build/bin/windows-amd64/
          mkdir -p build/bin/windows-amd64/tools
          if [ -f bin/plugin-validator.exe ]; then cp bin/plugin-validator.exe build/bin/windows-amd64/tools/; fi
          if [ -f bin/plugin-doc-generator.exe ]; then cp bin/plugin-doc-generator.exe build/bin/windows-amd64/tools/; fi
          if [ -f bin/plugin-doc-generator-all.exe ]; then cp bin/plugin-doc-generator-all.exe build/bin/windows-amd64/tools/; fi
          if [ -f bin/plugin-scaffolder.exe ]; then cp bin/plugin-scaffolder.exe build/bin/windows-amd64/tools/; fi
          if [ -f bin/plugin-to-nextflow.exe ]; then cp bin/plugin-to-nextflow.exe build/bin/windows-amd64/tools/; fi
          if [ -d bin/external ]; then cp -r bin/external build/bin/windows-amd64/tools/; fi
        shell: bash

      - name: Check archive size before compression
        run: |
          du -sh build/bin/windows-amd64/ || echo "du not available, using dir"
          if ! command -v du &> /dev/null; then dir build/bin/windows-amd64; fi
        shell: bash

      - name: Create Archive
        run: |
          cd build/bin/windows-amd64
          7z a ../../../cauldron-windows-amd64.zip cauldron.exe examples/ scripts/ plugins/ tools/
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cauldron-windows-amd64
          path: cauldron-windows-amd64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev \
            gfortran \
            libpng-dev \
            libjpeg-dev \
            liblzma-dev \
            libpcre2-dev \
            libcurl4-openssl-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libcairo2-dev \
            tcl-dev \
            tk-dev \
            libhdf5-dev \
            libblosc-dev \
            libhiredis-dev \
            libopenmpi-dev \
            liblzo2-dev \
            libomp-dev \
            libreadline-dev \
            bzip2 \
            python3-venv

      - name: Install portable R via cooker (downloads the tested, genuinely relocatable r-portable build instead of compiling a broken from-source one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/noatgnu/cookeR/releases/latest | jq -r '.assets[] | select(.name | endswith("linux-x86_64")) | .browser_download_url')
          curl -fsSL -o cooker "$ASSET_URL"
          chmod +x cooker
          R_VERSION=$(./cooker r list --available --json | jq -r '.[0].version')
          COOKER_INSTALL_DIR="${{ github.workspace }}" ./cooker r install "$R_VERSION"
          mv "${{ github.workspace }}/$R_VERSION" "${{ github.workspace }}/R"

      - name: Set R environment variables
        run: |
          echo "${{ github.workspace }}/R/bin" >> $GITHUB_PATH
          echo "R_HOME=${{ github.workspace }}/R" >> $GITHUB_ENV
          echo "R_LIBS_USER=${{ github.workspace }}/R_libs" >> $GITHUB_ENV
          mkdir -p "${{ github.workspace }}/R_libs"

      - name: Download Portable Python
        run: |
          curl -LO https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz

      - name: Extract Python
        run: |
          mkdir -p "${{ github.workspace }}/python"
          tar -xzf cpython-3.11.10+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz -C "${{ github.workspace }}/python" --no-same-owner --no-same-permissions
          echo "${{ github.workspace }}/python/bin" >> $GITHUB_PATH


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev


      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.15

      - name: Build Developer Tools
        run: ./build.sh tools

      - name: Build External Tools
        run: ./build.sh external linux/amd64

      - name: Validate Plugins
        run: |
          echo "Validating all plugins before release..."
          ./bin/linux-amd64/plugin-validator plugins/
          if [ $? -ne 0 ]; then
            echo "::error::Plugin validation failed - cannot create release"
            exit 1
          fi
          echo "::notice::All plugins validated successfully"

      - name: Create dummy frontend dist for embedding
        run: |
          mkdir -p frontend/dist/browser
          echo "placeholder" > frontend/dist/browser/index.html

      - name: Create dummy license files for embedding
        run: |
          mkdir -p resources/licenses
          echo "[]" > resources/licenses/go-licenses.json
          echo "[]" > resources/licenses/npm-licenses.json

      - name: Run Backend Tests
        run: go test -v -short -tags gtk4 ./backend/... ./cmd/...

      - name: Run E2E Tests (no plugins required)
        run: |
          go test -v -tags gtk4 -run "TestE2ESettingsManagement|TestE2EEnvironmentDetection|TestE2EFileOperations|TestE2EVersionChecks|TestE2ELogging|TestE2ETempFileOperations|TestE2EDefaultVenvPath|TestE2EJobQueueAdvanced|TestE2EPluginManagement" -timeout 120s

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts

      - name: Build shared-lib
        run: |
          cd shared-lib
          npm install
          npm run build

      - name: Generate Licenses
        run: |
          node scripts/generate-go-licenses.js
          cd frontend && npm install --silent && cd ..
          node scripts/generate-npm-licenses.js

      - name: Prepare Icons
        run: |
          mkdir -p build
          cp resources/appicon.png build/appicon.png

      - name: Build Application
        run: |
          cd frontend
          npm run build
          cd ..
          mkdir -p build/bin/linux-amd64
          CGO_ENABLED=1 go build -tags gtk4 -ldflags="-s -w" -o build/bin/linux-amd64/cauldron .

      - name: Clean up test environments
        run: |
          rm -rf R python cpython*.tar.gz cooker

      - name: Copy Resources
        run: |
          cp -r examples build/bin/linux-amd64/
          cp -r scripts build/bin/linux-amd64/
          cp -r plugins build/bin/linux-amd64/
          mkdir -p build/bin/linux-amd64/tools
          if [ -f bin/plugin-validator ]; then cp bin/plugin-validator build/bin/linux-amd64/tools/; fi
          if [ -f bin/plugin-doc-generator ]; then cp bin/plugin-doc-generator build/bin/linux-amd64/tools/; fi
          if [ -f bin/plugin-doc-generator-all ]; then cp bin/plugin-doc-generator-all build/bin/linux-amd64/tools/; fi
          if [ -f bin/plugin-scaffolder ]; then cp bin/plugin-scaffolder build/bin/linux-amd64/tools/; fi
          if [ -f bin/plugin-to-nextflow ]; then cp bin/plugin-to-nextflow build/bin/linux-amd64/tools/; fi
          if [ -d bin/external ]; then cp -r bin/external build/bin/linux-amd64/tools/; fi

      - name: Check archive size before compression
        run: |
          du -sh build/bin/linux-amd64/

      - name: Create Archive
        run: |
          cd build/bin/linux-amd64
          XZ_OPT=-9 tar -cJf ../../../cauldron-linux-amd64.tar.xz cauldron examples/ scripts/ plugins/ tools/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cauldron-linux-amd64
          path: cauldron-linux-amd64.tar.xz


  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Set up dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install --cask xquartz
          brew install gfortran pkg-config libpng jpeg xz pcre2 curl harfbuzz fribidi libx11 libxext libxrender libxtst cairo tcl-tk hdf5 c-blosc hiredis open-mpi lzo bzip2

      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Set up PATH
        run: |
          echo "$(brew --prefix gcc)/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/jpeg/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/open-mpi/bin" >> $GITHUB_PATH
          echo "$(brew --prefix hdf5)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix lzo)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix c-blosc)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix bzip2)/bin" >> $GITHUB_PATH

      - name: Install portable R via cooker (downloads the tested, genuinely relocatable r-portable build instead of compiling a broken from-source one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/noatgnu/cookeR/releases/latest | jq -r '.assets[] | select(.name | endswith("macos-arm64")) | .browser_download_url')
          curl -fsSL -o cooker "$ASSET_URL"
          chmod +x cooker
          R_VERSION=$(./cooker r list --available --json | jq -r '.[0].version')
          COOKER_INSTALL_DIR="${{ github.workspace }}" ./cooker r install "$R_VERSION"
          mv "${{ github.workspace }}/$R_VERSION" "${{ github.workspace }}/R"

      - name: Set R environment variables
        run: |
          echo "${{ github.workspace }}/R/bin" >> $GITHUB_PATH
          echo "R_HOME=${{ github.workspace }}/R" >> $GITHUB_ENV
          echo "R_LIBS_USER=${{ github.workspace }}/R_libs" >> $GITHUB_ENV
          mkdir -p "${{ github.workspace }}/R_libs"

      - name: Download Portable Python
        run: |
          curl -LO https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-aarch64-apple-darwin-install_only.tar.gz

      - name: Extract Python
        run: |
          mkdir -p "${{ github.workspace }}/python"
          tar -xzf cpython-3.11.10+20241016-aarch64-apple-darwin-install_only.tar.gz -C "${{ github.workspace }}/python" --no-same-owner --no-same-permissions
          echo "${{ github.workspace }}/python/bin" >> $GITHUB_PATH

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.15

      - name: Build Developer Tools
        run: ./build.sh tools

      - name: Build External Tools
        run: ./build.sh external darwin/arm64

      - name: Validate Plugins
        run: |
          echo "Validating all plugins before release..."
          ./bin/darwin-arm64/plugin-validator plugins/
          if [ $? -ne 0 ]; then
            echo "::error::Plugin validation failed - cannot create release"
            exit 1
          fi
          echo "::notice::All plugins validated successfully"

      - name: Create dummy frontend dist for embedding
        run: |
          mkdir -p frontend/dist/browser
          echo "placeholder" > frontend/dist/browser/index.html

      - name: Create dummy license files for embedding
        run: |
          mkdir -p resources/licenses
          echo "[]" > resources/licenses/go-licenses.json
          echo "[]" > resources/licenses/npm-licenses.json

      - name: Run Backend Tests
        run: go test -v -short ./backend/... ./cmd/...

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts

      - name: Build shared-lib
        run: |
          cd shared-lib
          npm install
          npm run build

      - name: Generate Licenses
        run: |
          node scripts/generate-go-licenses.js
          cd frontend && npm install --silent && cd ..
          node scripts/generate-npm-licenses.js

      - name: Prepare Icons
        run: |
          mkdir -p build
          cp resources/appicon.png build/appicon.png

      - name: Build Application
        run: |
          cd frontend
          npm run build
          cd ..
          mkdir -p build/bin/darwin-arm64
          CGO_ENABLED=1 go build -ldflags="-s -w" -o build/bin/darwin-arm64/cauldron .

      - name: Verify Build
        run: ls -l build/bin/darwin-arm64/

      - name: Clean up test environments
        run: |
          rm -rf R python cpython*.tar.gz cooker

      - name: Copy Resources
        run: |
          cp -r examples build/bin/darwin-arm64/
          cp -r scripts build/bin/darwin-arm64/
          cp -r plugins build/bin/darwin-arm64/
          mkdir -p build/bin/darwin-arm64/tools
          if [ -f bin/plugin-validator ]; then cp bin/plugin-validator build/bin/darwin-arm64/tools/; fi
          if [ -f bin/plugin-doc-generator ]; then cp bin/plugin-doc-generator build/bin/darwin-arm64/tools/; fi
          if [ -f bin/plugin-doc-generator-all ]; then cp bin/plugin-doc-generator-all build/bin/darwin-arm64/tools/; fi
          if [ -f bin/plugin-scaffolder ]; then cp bin/plugin-scaffolder build/bin/darwin-arm64/tools/; fi
          if [ -f bin/plugin-to-nextflow ]; then cp bin/plugin-to-nextflow build/bin/darwin-arm64/tools/; fi
          if [ -d bin/external ]; then cp -r bin/external build/bin/darwin-arm64/tools/; fi

      - name: Check archive size before compression
        run: |
          du -sh build/bin/darwin-arm64/

      - name: Create Archive
        run: |
          cd build/bin/darwin-arm64
          XZ_OPT=-9 tar -cJf ../../../cauldron-darwin-arm64.tar.xz cauldron examples/ scripts/ plugins/ tools/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cauldron-darwin-arm64
          path: cauldron-darwin-arm64.tar.xz

  create-release:
    needs: [build-windows, build-linux, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            cauldron-windows-amd64/cauldron-windows-amd64.zip
            cauldron-linux-amd64/cauldron-linux-amd64.tar.xz
            cauldron-darwin-arm64/cauldron-darwin-arm64.tar.xz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
