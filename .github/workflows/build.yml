name: Build and Test

on:
  push:
    branches:
      - master
      - main
      - develop
      - uv-integration
  pull_request:
    branches:
      - master
      - main
      - develop

jobs:
  build-dev-tools:
    name: Build Developer Tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Build developer tools
        run: ./build.sh tools

      - name: Build external utilities
        run: ./build.sh external linux/amd64

      - name: Test plugin-validator
        run: ./bin/linux-amd64/plugin-validator plugins/pca-analysis

      - name: Test plugin-to-nextflow
        run: ./bin/linux-amd64/plugin-to-nextflow --plugin plugins/pca-analysis --output /tmp/nf-pca

      - name: Test doc generator
        run: ./bin/linux-amd64/plugin-doc-generator plugins/pca-analysis

      - name: Validate all plugins
        run: ./bin/linux-amd64/plugin-validator plugins/

      - name: Test uniprot-fetcher help
        run: ./bin/external/linux-amd64/uniprot-fetcher --help

      - name: Test utility programs
        run: |
          echo "Testing uniprot-fetcher text mode..."
          ./bin/external/linux-amd64/uniprot-fetcher --ids "P12345" --from "UniProtKB_AC-ID" --fields "accession,id" --output /tmp/uniprot-test
          if [ ! -f /tmp/uniprot-test/uniprot_results.tsv ]; then
            echo "::error::uniprot-fetcher failed to create output file"
            exit 1
          fi
          echo "::notice::uniprot-fetcher test passed"

      - name: Upload tools as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-tools-linux
          path: bin/linux-amd64/

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev \
            gfortran \
            libpng-dev \
            libjpeg-dev \
            liblzma-dev \
            libpcre2-dev \
            libcurl4-openssl-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libcairo2-dev \
            tcl-dev \
            tk-dev \
            libhdf5-dev \
            libblosc-dev \
            libhiredis-dev \
            libopenmpi-dev \
            liblzo2-dev \
            libomp-dev \
            libreadline-dev \
            bzip2 \
            python3-venv \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Compile R
        run: |
          curl -O https://cran.r-project.org/src/base/R-4/R-4.5.2.tar.gz
          tar -xzvf R-4.5.2.tar.gz
          cd R-4.5.2
          CPPFLAGS="-I/usr/include -I/usr/include/xorg" \
          LDFLAGS="-L/usr/lib -L/usr/lib/xorg" \
          CFLAGS="-I/usr/include" \
          TCL_LIBRARY="/usr/lib/tcltk" \
          TK_LIBRARY="/usr/lib/tcltk" \
          PKG_CONFIG_PATH="/usr/lib/pkgconfig" \
          C_INCLUDE_PATH="/usr/include" \
          LIBRARY_PATH="/usr/lib" \
          ./configure --prefix=${{ github.workspace }}/R --enable-R-shlib --with-blas --with-lapack --with-tcltk --with-mpi
          make -j$(nproc)
          make install

      - name: Set R environment variables
        run: |
          echo "${{ github.workspace }}/R/bin" >> $GITHUB_PATH
          echo "R_HOME=${{ github.workspace }}/R" >> $GITHUB_ENV
          echo "R_LIBS_USER=${{ github.workspace }}/R_libs" >> $GITHUB_ENV
          mkdir -p "${{ github.workspace }}/R_libs"

      - name: Download Portable Python
        run: |
          curl -L --retry 5 --retry-delay 5 --retry-connrefused -O https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz

      - name: Extract Python
        run: |
          mkdir -p "${{ github.workspace }}/python"
          tar -xzf cpython-3.11.10+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz -C "${{ github.workspace }}/python" --no-same-owner --no-same-permissions
          echo "${{ github.workspace }}/python/bin" >> $GITHUB_PATH

      - name: Build developer tools
        run: ./build.sh tools

      - name: Build external utilities
        run: ./build.sh external linux/amd64

      - name: Create dummy frontend dist for embedding
        run: |
          mkdir -p frontend/dist/browser
          echo "placeholder" > frontend/dist/browser/index.html

      - name: Create dummy license files for embedding
        run: |
          mkdir -p resources/licenses
          echo "[]" > resources/licenses/go-licenses.json
          echo "[]" > resources/licenses/npm-licenses.json

      - name: Run backend unit tests
        run: go test -v -short -tags gtk4 ./backend/... ./cmd/...

      - name: Run job queue service tests
        run: go test -v -tags gtk4 -run "TestJobQueue" -timeout 60s

      - name: Run basic E2E tests (no plugins required)
        run: |
          go test -v -tags gtk4 -run "TestE2ESettingsManagement|TestE2EEnvironmentDetection|TestE2EFileOperations|TestE2EVersionChecks|TestE2ELicenseInfo|TestE2ELogging|TestE2ETempFileOperations|TestE2EDefaultVenvPath|TestE2EJobQueueAdvanced" -timeout 120s

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Install system dependencies for Wails
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.15

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts

      - name: Install shared-lib dependencies
        working-directory: shared-lib
        run: npm install

      - name: Build shared-lib
        working-directory: shared-lib
        run: npm run build

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  integration-test:
    name: Integration Test
    needs: [build-dev-tools, build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download dev tools
        uses: actions/download-artifact@v4
        with:
          name: dev-tools-linux
          path: bin/

      - name: Make tools executable
        run: chmod -R +x bin/

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Validate all plugins
        run: ./bin/plugin-validator plugins/

      - name: Generate all documentation
        run: ./bin/plugin-doc-generator-all

      - name: Check directory structure
        run: |
          echo "Checking required directories..."
          test -d plugins && echo "[SUCCESS] plugins/ exists" || echo "[ERROR] plugins/ missing"
          test -d examples && echo "[SUCCESS] examples/ exists" || echo "[ERROR] examples/ missing"
          test -d scripts && echo "[SUCCESS] scripts/ exists" || echo "[ERROR] scripts/ missing"
          test -d bin && echo "[SUCCESS] bin/ exists" || echo "[ERROR] bin/ missing"
          test -d frontend/dist && echo "[SUCCESS] frontend/dist/ exists" || echo "[ERROR] frontend/dist/ missing"

          echo ""
          echo "Plugin count:"
          find plugins -name "plugin.yaml" | wc -l

          echo ""
          echo "Dev tools built:"
          ls -lh bin/

  e2e-plugin-tests:
    name: E2E Plugin Tests
    needs: [build-dev-tools, build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev \
            libpng-dev \
            libjpeg-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libcairo2-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            python3-venv \
            python3-pip

      - name: Download Portable Python
        run: |
          curl -L --retry 5 --retry-delay 5 --retry-connrefused -O https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz

      - name: Extract Python
        run: |
          mkdir -p "${{ github.workspace }}/python"
          tar -xzf cpython-3.11.10+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz -C "${{ github.workspace }}/python" --no-same-owner --no-same-permissions
          echo "${{ github.workspace }}/python/python/bin" >> $GITHUB_PATH

      - name: Install Python dependencies for plugins
        run: |
          ${{ github.workspace }}/python/python/bin/pip3 install pandas numpy matplotlib seaborn scipy

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.15

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts

      - name: Build shared-lib
        working-directory: shared-lib
        run: |
          npm install
          npm run build

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build developer tools
        run: ./build.sh tools

      - name: Build external utilities
        run: ./build.sh external linux/amd64

      - name: Setup build directory structure
        run: |
          mkdir -p build/bin/plugins
          mkdir -p build/bin/examples
          cp -r plugins/* build/bin/plugins/
          cp -r examples/* build/bin/examples/

      - name: Create dummy frontend dist for embedding
        run: |
          mkdir -p frontend/dist/browser
          echo "placeholder" > frontend/dist/browser/index.html

      - name: Create dummy license files for embedding
        run: |
          mkdir -p resources/licenses
          echo "[]" > resources/licenses/go-licenses.json
          echo "[]" > resources/licenses/npm-licenses.json

      - name: Run E2E plugin management tests
        run: |
          go test -v -tags gtk4 -run "TestE2EPluginManagement" -timeout 60s

      - name: Run E2E plugin requirements tests
        env:
          BUILD_DIR: ${{ github.workspace }}/build/bin
        run: |
          go test -v -tags gtk4 -run "TestE2EPluginRequirements" -timeout 120s

      - name: Run E2E process job code path tests
        env:
          BUILD_DIR: ${{ github.workspace }}/build/bin
        run: |
          go test -v -tags gtk4 -run "TestE2EProcessJobCodePath" -timeout 120s

  e2e-full-plugin-execution:
    name: E2E Full Plugin Execution
    needs: [build-dev-tools, build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev \
            libpng-dev \
            libjpeg-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libcairo2-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            python3-venv \
            python3-pip

      - name: Download Portable Python
        run: |
          curl -L --retry 5 --retry-delay 5 --retry-connrefused -O https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz

      - name: Extract Python
        run: |
          mkdir -p "${{ github.workspace }}/python"
          tar -xzf cpython-3.11.10+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz -C "${{ github.workspace }}/python" --no-same-owner --no-same-permissions
          echo "${{ github.workspace }}/python/python/bin" >> $GITHUB_PATH

      - name: Install base Python dependencies
        run: |
          ${{ github.workspace }}/python/python/bin/pip3 install pip --upgrade

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.15

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts

      - name: Build shared-lib
        working-directory: shared-lib
        run: |
          npm install
          npm run build

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build developer tools
        run: ./build.sh tools

      - name: Build external utilities
        run: ./build.sh external linux/amd64

      - name: Setup build directory structure for E2E tests
        run: |
          mkdir -p build/bin/plugins
          mkdir -p build/bin/examples/diann
          cp -r plugins/* build/bin/plugins/
          cp -r examples/diann/* build/bin/examples/diann/

      - name: Create dummy frontend dist for embedding
        run: |
          mkdir -p frontend/dist/browser
          echo "placeholder" > frontend/dist/browser/index.html

      - name: Create dummy license files for embedding
        run: |
          mkdir -p resources/licenses
          echo "[]" > resources/licenses/go-licenses.json
          echo "[]" > resources/licenses/npm-licenses.json

      - name: Verify example data exists
        run: |
          echo "Checking example data files..."
          ls -la build/bin/examples/diann/
          test -f build/bin/examples/diann/annotation.txt && echo "[SUCCESS] annotation.txt exists"
          test -f build/bin/examples/diann/Reports.log.txt && echo "[SUCCESS] Reports.log.txt exists"
          test -f build/bin/examples/diann/Reports.pr_matrix.tsv && echo "[SUCCESS] Reports.pr_matrix.tsv exists"
          test -f build/bin/examples/diann/Reports.pg_matrix.tsv && echo "[SUCCESS] Reports.pg_matrix.tsv exists"

      - name: Run E2E tests with actual plugins
        env:
          BUILD_DIR: ${{ github.workspace }}/build/bin
        run: |
          go test -v -tags gtk4 -run "TestE2EWithActualPlugins" -timeout 300s

      - name: Run E2E job output operations test
        env:
          BUILD_DIR: ${{ github.workspace }}/build/bin
        run: |
          go test -v -tags gtk4 -run "TestE2EJobOutputOperations" -timeout 300s

  e2e-playwright-tests:
    name: Playwright E2E Tests
    needs: [build-dev-tools, build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev \
            gfortran \
            libpng-dev \
            libjpeg-dev \
            liblzma-dev \
            libpcre2-dev \
            libcurl4-openssl-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libcairo2-dev \
            tcl-dev \
            tk-dev \
            libhdf5-dev \
            libblosc-dev \
            libhiredis-dev \
            libopenmpi-dev \
            liblzo2-dev \
            libomp-dev \
            libreadline-dev \
            bzip2 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            xvfb \
            fluxbox \
            dbus-x11

      - name: Allow unprivileged user namespaces (required by bubblewrap/WebKitGTK sandbox)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Compile R
        run: |
          curl -O https://cran.r-project.org/src/base/R-4/R-4.5.2.tar.gz
          tar -xzvf R-4.5.2.tar.gz
          cd R-4.5.2
          CPPFLAGS="-I/usr/include -I/usr/include/xorg" \
          LDFLAGS="-L/usr/lib -L/usr/lib/xorg" \
          CFLAGS="-I/usr/include" \
          TCL_LIBRARY="/usr/lib/tcltk" \
          TK_LIBRARY="/usr/lib/tcltk" \
          PKG_CONFIG_PATH="/usr/lib/pkgconfig" \
          C_INCLUDE_PATH="/usr/include" \
          LIBRARY_PATH="/usr/lib" \
          ./configure --prefix=${{ github.workspace }}/R --enable-R-shlib --with-blas --with-lapack --with-tcltk --with-mpi
          make -j$(nproc)
          make install

      - name: Set R environment variables
        run: |
          echo "${{ github.workspace }}/R/bin" >> $GITHUB_PATH
          echo "R_HOME=${{ github.workspace }}/R" >> $GITHUB_ENV
          echo "R_LIBS_USER=${{ github.workspace }}/R_libs" >> $GITHUB_ENV
          mkdir -p "${{ github.workspace }}/R_libs"

      - name: Download Portable Python
        run: |
          curl -L --retry 5 --retry-delay 5 --retry-connrefused -O https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.11.10+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz

      - name: Extract Python
        run: |
          mkdir -p "${{ github.workspace }}/python"
          tar -xzf cpython-3.11.10+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz -C "${{ github.workspace }}/python" --no-same-owner --no-same-permissions
          echo "${{ github.workspace }}/python/python/bin" >> $GITHUB_PATH

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.15

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts

      - name: Build shared-lib
        working-directory: shared-lib
        run: |
          npm install
          npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Create dummy license files for embedding
        run: |
          mkdir -p resources/licenses
          echo "[]" > resources/licenses/go-licenses.json
          echo "[]" > resources/licenses/npm-licenses.json

      - name: Build application
        run: |
          go build -tags mcp -o ./build/bin/cauldron .

      - name: Copy plugins to build directory
        run: |
          cp -r plugins ./build/bin/plugins

      - name: Start application and run Playwright tests
        env:
          DISPLAY: ':99'
          CI: 'true'
          WAILS_MCP: '1'
          MCP_URL: 'http://127.0.0.1:9099/mcp'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

          DISPLAY=:99 fluxbox &
          sleep 2

          cd ${{ github.workspace }}

          dbus-run-session -- env WAILS_MCP=1 WEBKIT_DISABLE_SANDBOX=1 ./build/bin/cauldron > /tmp/cauldron-e2e.log 2>&1 &
          APP_PID=$!

          echo "Waiting for MCP server..."
          for i in {1..60}; do
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "App process exited unexpectedly while waiting for MCP server"
              cat /tmp/cauldron-e2e.log
              exit 1
            fi
            if curl -s -X POST http://127.0.0.1:9099/mcp \
                 -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
                 -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' 2>/dev/null | grep -q '"tools"'; then
              echo "MCP server is ready on port 9099"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Timeout waiting for MCP server"
              cat /tmp/cauldron-e2e.log
              exit 1
            fi
            sleep 1
          done

          sleep 2

          cd frontend
          set +e
          npx playwright test --reporter=html
          TEST_EXIT=$?
          set -e

          kill $APP_PID 2>/dev/null || true

          echo "=== Cauldron app log ==="
          cat /tmp/cauldron-e2e.log || true

          exit $TEST_EXIT

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
