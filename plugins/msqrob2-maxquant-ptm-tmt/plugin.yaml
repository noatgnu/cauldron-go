plugin:
  id: "msqrob2-maxquant-ptm-tmt"
  name: "MSqRob2 MaxQuant PTM TMT Analysis"
  description: "Differential abundance and usage analysis for PTM data from MaxQuant with TMT labeling using msqrob2"
  version: "1.0.0"
  author: "CauldronGO Team"
  category: "statistics"
  subcategory: "msqrob2"
  icon: "biotech"

runtime:
  type: "r"
  script: "msqrob2_maxquant_ptm_tmt_modular.R"

inputs:
  - name: "input_file"
    label: "PTM Evidence File"
    type: "file"
    required: true
    accept: ".txt"
    description: "MaxQuant evidence.txt file with PTM data"

  - name: "fasta_file"
    label: "FASTA File"
    type: "file"
    required: false
    accept: ".fasta,.fa"
    description: "Protein database FASTA file for site mapping"

  - name: "annotation_file"
    label: "PTM Annotation File"
    type: "file"
    required: true
    accept: ".csv,.tsv,.txt"
    disableAnnotationManagement: true
    description: "Annotation file for PTM data (columns: Sample, Condition, BioReplicate)"
    tableColumns:
      - name: "Sample"
        label: "Sample"
        type: "text"
        required: true
        description: "Sample identifier matching column names in data (e.g. Reporter intensity corrected 1)"
      - name: "Condition"
        label: "Condition"
        type: "text"
        required: true
        description: "Experimental condition/group name"
      - name: "BioReplicate"
        label: "BioReplicate"
        type: "text"
        required: true
        description: "Biological replicate number"

  - name: "annotation_protein_file"
    label: "Protein Annotation File"
    type: "file"
    required: false
    accept: ".csv,.tsv,.txt"
    disableAnnotationManagement: true
    description: "Annotation file for Protein data (columns: Sample, Condition, BioReplicate)"
    tableColumns:
      - name: "Sample"
        label: "Sample"
        type: "text"
        required: true
        description: "Sample identifier matching column names in protein file"
      - name: "Condition"
        label: "Condition"
        type: "text"
        required: true
        description: "Experimental condition/group name"
      - name: "BioReplicate"
        label: "BioReplicate"
        type: "text"
        required: true
        description: "Biological replicate number"

  - name: "feature_id_col"
    label: "PTM Feature ID Column"
    type: "text"
    required: true
    default: "Sequence"
    description: "Column name for feature identifiers in PTM file (stripped sequence)"

  - name: "site_col"
    label: "PTM Site Column"
    type: "text"
    required: true
    default: "Modified sequence"
    description: "Column name for PTM site information (modified sequence)"

  - name: "protein_col"
    label: "PTM Protein Column"
    type: "text"
    required: true
    default: "Proteins"
    description: "Column name for protein identifiers in PTM file"

  - name: "probability_col"
    label: "PTM Probability Column"
    type: "text"
    required: false
    default: "Phospho (STY) Probabilities"
    description: "Column name for site localization probabilities (e.g., Phospho (STY) Probabilities)"

  - name: "min_probability"
    label: "Minimum Localization Probability"
    type: "number"
    required: false
    default: 0.75
    min: 0
    max: 1
    step: 0.05
    description: "Minimum probability score for valid PTM sites (0-1)"

  - name: "protein_file"
    label: "Protein Evidence File"
    type: "file"
    required: false
    accept: ".txt"
    description: "MaxQuant evidence.txt file for protein-level data (optional)"

  - name: "protein_feature_id_col"
    label: "Protein Feature ID Column"
    type: "text"
    required: false
    default: "Sequence"
    description: "Column name for feature identifiers in protein file"

  - name: "protein_id_col"
    label: "Protein ID Column"
    type: "text"
    required: false
    default: "Proteins"
    description: "Column name for protein identifiers in protein file"

  - name: "comparison_file"
    label: "Comparison Matrix File"
    type: "file"
    required: false
    accept: ".csv,.tsv,.txt"
    description: "Pairwise comparisons (columns: comparison_label, condition_A, condition_B)"

  - name: "log2_transform"
    label: "Apply Log2 Transformation"
    type: "boolean"
    default: true
    description: "Apply log2 transformation to intensities"

  - name: "analysis_type"
    label: "Analysis Type"
    type: "select"
    required: false
    default: "both"
    options:
      - "DPA"
      - "DPU"
      - "both"
    description: "DPA = Differential Peptide Abundance, DPU = Differential Peptide Usage"

  - name: "exclude_conditions"
    label: "Exclude Conditions (comma-separated)"
    type: "text"
    required: false
    description: "Comma-separated list of conditions to exclude from analysis (e.g., 'Norm,Empty'). These channels will be filtered out before statistical testing."

  - name: "remove_norm_channel"
    label: "Remove 'Norm' Channel"
    type: "boolean"
    default: true
    description: "Automatically remove samples with condition 'Norm'"

  - name: "col_filter"
    label: "Column Completeness Threshold"
    type: "number"
    required: false
    default: 0.7
    min: 0
    max: 1
    step: 0.05
    description: "Maximum proportion of missing values allowed per sample. Default 0.7 = keep samples with ≥30% valid measurements."

  - name: "row_filter"
    label: "Row Completeness Threshold"
    type: "number"
    required: false
    default: 0.7
    min: 0
    max: 1
    step: 0.05
    description: "Maximum proportion of missing values allowed per feature. Default 0.7 = keep features with ≥30% valid measurements."

  - name: "impute_order"
    label: "Imputation Order"
    type: "select"
    default: "after"
    options:
      - "before"
      - "after"
    description: "When to impute missing values relative to normalization. 'after': normalize then impute. 'before': impute then normalize."

  - name: "impute"
    label: "Imputation Method"
    type: "select"
    required: false
    default: "knn"
    options:
      - "none"
      - "knn"
      - "MinDet"
      - "MinProb"
      - "min"
      - "zero"
      - "mixed"
      - "nbavg"
      - "with"
      - "QRILC"
      - "MLE"
      - "bpca"
    description: "Imputation method for missing values"

  - name: "normalize_method"
    label: "Normalization Method"
    type: "select"
    required: false
    default: "center.median"
    options:
      - "none"
      - "center.median"
      - "center.mean"
      - "quantiles"
      - "quantiles.robust"
      - "vsn"
    description: "Normalization method to apply"

  - name: "aggregation_order"
    label: "Aggregation Order"
    type: "select"
    default: "after"
    options:
      - "before"
      - "after"
    description: "When to aggregate peptides to proteins. 'after': normalize/impute peptides then aggregate. 'before': aggregate peptides then normalize proteins."

  - name: "summarization_method"
    label: "Protein Summarization Method"
    type: "select"
    required: false
    default: "robust"
    options:
      - "robust"
      - "sum"
      - "mean"
      - "median"
    description: "Method for combining feature intensities. 'robust': Tukey's median polish. 'median': median. 'mean': arithmetic mean. 'sum': sum."

  - name: "remove_shared_peptides"
    label: "Remove Shared Peptides"
    type: "boolean"
    default: true
    description: "Remove peptides mapping to multiple proteins"

  - name: "filter_min_peptides"
    label: "Minimum Peptides per Protein"
    type: "number"
    required: false
    default: 2
    min: 1
    max: 10
    step: 1
    description: "Minimum number of peptides required per protein"

  - name: "filter_min_ptm_sites"
    label: "Minimum PTM Sites"
    type: "number"
    default: 1
    description: "Minimum number of PTM sites required"

  - name: "model_run_effect"
    label: "Model Run Effect"
    type: "boolean"
    default: false
    description: "Include TMT run as random effect in the model. Requires 'Run' column in annotation file with multiple run values."

  - name: "robust_regression"
    label: "Use Robust Regression"
    type: "boolean"
    default: false
    description: "Use robust M-estimation for model fitting. May fail with sparse PTM data; use FALSE if you encounter convergence issues."

  - name: "ridge_penalty"
    label: "Ridge Penalty"
    type: "number"
    required: false
    default: 0
    min: 0
    max: 1
    step: 0.01
    description: "L2 regularization penalty for model fitting. 0 = no penalty."

  - name: "max_iterations"
    label: "Maximum Iterations"
    type: "number"
    required: false
    default: 20
    min: 5
    max: 100
    step: 5
    description: "Maximum iterations for robust regression convergence."

  - name: "adjust_method"
    label: "P-value Adjustment Method"
    type: "select"
    required: false
    default: "BH"
    options:
      - "BH"
      - "bonferroni"
      - "holm"
      - "hochberg"
      - "BY"
      - "none"
    description: "Method for multiple testing correction"

  - name: "alpha"
    label: "Significance Level"
    type: "number"
    required: false
    default: 0.05
    min: 0.001
    max: 0.2
    step: 0.001
    description: "Adjusted p-value threshold for significance."

  - name: "lfc_threshold"
    label: "Log2 Fold Change Threshold"
    type: "number"
    required: false
    default: 0
    min: 0
    max: 5
    step: 0.1
    description: "Minimum absolute log2 fold-change threshold. 0 = no fold-change filter."

outputs:
  - name: "dpa_results"
    path: "dpa_results.txt"
    type: "data"
    description: "Differential peptide abundance (DPA) results"
    format: "tsv"

  - name: "dpu_results"
    path: "dpu_results.txt"
    type: "data"
    description: "Differential peptide usage (DPU) results"
    format: "tsv"

  - name: "protein_results"
    path: "protein_results.txt"
    type: "data"
    description: "Protein-level differential abundance results"
    format: "tsv"

  - name: "protein_intensities"
    path: "protein_intensities.txt"
    type: "data"
    description: "Summarized protein-level intensities"
    format: "tsv"

  - name: "normalized_peptides"
    path: "peptidoform_intensities.txt"
    type: "data"
    description: "Normalized peptide-level intensities"
    format: "tsv"

  - name: "protein_qc_plots"
    path: "protein_qc_plots.pdf"
    type: "plot"
    description: "Quality control plots for global protein data (boxplots, PCA)"
    format: "pdf"

  - name: "protein_volcano_plots"
    path: "protein_volcano_plots.pdf"
    type: "plot"
    description: "Volcano plots for global protein data"
    format: "pdf"

  - name: "ptm_qc_plots"
    path: "ptm_qc_plots.pdf"
    type: "plot"
    description: "Quality control plots for PTM data (boxplots, PCA)"
    format: "pdf"

  - name: "ptm_volcano_plots"
    path: "ptm_volcano_plots.pdf"
    type: "plot"
    description: "Volcano plots for PTM data (DPA and DPU)"
    format: "pdf"

execution:
  argsMapping:
    input_file: "--input_file"
    fasta_file: "--fasta_file"
    annotation_file: "--annotation_file"
    annotation_protein_file: "--annotation_protein_file"
    feature_id_col: "--feature_id_col"
    site_col: "--site_col"
    protein_col: "--protein_col"
    protein_file: "--protein_file"
    protein_feature_id_col: "--protein_feature_id_col"
    protein_id_col: "--protein_id_col"
    probability_col: "--probability_col"
    min_probability: "--min_probability"
    comparison_file: "--comparison_file"
    log2_transform:
      flag: "--log2_transform"
      when: "true"
    analysis_type: "--analysis_type"
    exclude_conditions: "--exclude_conditions"
    remove_norm_channel:
      flag: "--remove_norm_channel"
      when: "true"
    col_filter: "--col_filter"
    row_filter: "--row_filter"
    impute_order: "--impute_order"
    impute: "--impute"
    normalize_method: "--normalize_method"
    aggregation_order: "--aggregation_order"
    summarization_method: "--summarization_method"
    remove_shared_peptides:
      flag: "--remove_shared_peptides"
      when: "true"
    filter_min_peptides: "--filter_min_peptides"
    filter_min_ptm_sites: "--filter_min_ptm_sites"
    model_run_effect:
      flag: "--model_run_effect"
      when: "true"
    robust_regression:
      flag: "--robust_regression"
      when: "true"
    ridge_penalty: "--ridge_penalty"
    max_iterations: "--max_iterations"
    adjust_method: "--adjust_method"
    alpha: "--alpha"
    lfc_threshold: "--lfc_threshold"

  outputDir: "--output_folder"

  requirements:
    r: ">=4.0"
    rPackagesFile: "r-packages.txt"

example:
  enabled: true
  values:
    input_file: "maxquant-tmt/evidence_ptm.txt"
    fasta_file: "maxquant-tmt/uniprot_human.fasta"
    annotation_file: "maxquant-tmt/annotation_ptm_msqrob2.txt"
    annotation_protein_file: "maxquant-tmt/annotation_protein_msqrob2.txt"
    feature_id_col: "Sequence"
    site_col: "Modified sequence"
    protein_col: "Proteins"
    protein_file: "maxquant-tmt/evidence_protein.txt"
    protein_feature_id_col: "Sequence"
    protein_id_col: "Proteins"
    probability_col: "Phospho (STY) Probabilities"
    min_probability: 0.75
    log2_transform: true
    analysis_type: "both"
    exclude_conditions: "Norm"
    remove_norm_channel: true
    filter_min_peptides: 2
    remove_shared_peptides: true
    filter_min_ptm_sites: 1
    impute: "knn"
    impute_order: "after"
    normalize_method: "center.median"
    aggregation_order: "after"
    summarization_method: "robust"
    model_run_effect: false
    robust_regression: false

diagram:
  enabled: true
