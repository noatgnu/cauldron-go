---
plugin:
  id: "bubble-plot"
  name: "Bubble Plot Heat Map"
  description: "Create interactive bubble plot heat maps where bubble size and color represent intensity values across features and samples"
  version: "1.0.0"
  author: "CauldronGO Team (based on noatgnu/bubble-plot)"
  category: "visualization"
  icon: "bubble_chart"

runtime:
  environments: ["python"]
  entrypoint: "bubble_plot.py"

inputs:
  - name: "input_file"
    label: "Input Data File"
    type: "file"
    required: true
    accept: ".txt,.tsv,.csv"
    description: "Wide-format data table with features in first column and samples in subsequent columns (e.g., peptide_intensities_wide.txt from MSstatsPTM)"

  - name: "separator"
    label: "Column Separator"
    type: "select"
    required: false
    default: "\t"
    options:
      - "\t"
      - ","
      - ";"
    optionLabels:
      - "Tab"
      - "Comma"
      - "Semicolon"
    description: "Character used to separate columns in the input file"

  - name: "log_transform"
    label: "Apply Log10 Transformation"
    type: "boolean"
    required: false
    default: true
    description: "Apply log10 transformation to intensity values for better visualization of dynamic range"

  - name: "colormap"
    label: "Color Scheme"
    type: "select"
    required: false
    default: "yellow_red"
    options:
      - "yellow_red"
      - "blue_red"
      - "green_purple"
      - "viridis"
      - "plasma"
    optionLabels:
      - "Yellow to Red"
      - "Blue to Red"
      - "Green to Purple"
      - "Viridis"
      - "Plasma"
    description: "Color palette for representing intensity values"

  - name: "min_radius"
    label: "Minimum Bubble Size"
    type: "number"
    required: false
    default: 0.2
    min: 0.1
    max: 0.5
    step: 0.05
    description: "Minimum radius for bubbles representing lowest values"

  - name: "max_radius"
    label: "Maximum Bubble Size"
    type: "number"
    required: false
    default: 0.5
    min: 0.3
    max: 1.0
    step: 0.05
    description: "Maximum radius for bubbles representing highest values"

  - name: "output_format"
    label: "Output Format"
    type: "select"
    required: false
    default: "both"
    options:
      - "png"
      - "pdf"
      - "both"
    optionLabels:
      - "PNG only"
      - "PDF only"
      - "Both PNG and PDF"
    description: "File format(s) for output visualization"

  - name: "dpi"
    label: "Resolution (DPI)"
    type: "number"
    required: false
    default: 300
    min: 72
    max: 600
    step: 50
    description: "Output resolution in dots per inch (higher values = better quality but larger file size)"

outputs:
  - name: "bubble_plot_png"
    path: "bubble_plot.png"
    type: "plot"
    description: "Bubble plot heat map visualization in PNG format"
    format: "png"
    optional: true

  - name: "bubble_plot_pdf"
    path: "bubble_plot.pdf"
    type: "plot"
    description: "Bubble plot heat map visualization in PDF format"
    format: "pdf"
    optional: true

execution:
  argsMapping:
    input_file: "--input_file"
    separator: "--separator"
    log_transform:
      flag: "--log_transform"
      when: "true"
      negate: "--no_log_transform"
    colormap: "--colormap"
    min_radius: "--min_radius"
    max_radius: "--max_radius"
    output_format: "--output_format"
    dpi: "--dpi"

  outputDir: "--output_folder"

  requirements:
    python: ">=3.8"
    pythonRequirementsFile: "requirements.txt"

example:
  enabled: false
