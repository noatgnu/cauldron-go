<h2 id="description">Description</h2>
<p>Robust statistical inference for TMT-labeled quantitative proteomics data from MaxQuant using msqrob2</p>

<h3 id="input-details">Input Details</h3>
<h4 id="maxquant-evidence-file-input-file">MaxQuant Evidence File (<code>input_file</code>)</h4>
<p>MaxQuant evidence.txt file</p>
<h4 id="sample-annotation-file-annotation-file">Sample Annotation File (<code>annotation_file</code>)</h4>
<p>Sample annotation with columns: Sample (matching intensity column names in data), Condition, BioReplicate</p>
<h4 id="comparison-matrix-file-comparison-file">Comparison Matrix File (<code>comparison_file</code>)</h4>
<p>Pairwise comparisons (columns: comparison_label, condition_A, condition_B)</p>
<h4 id="feature-id-column-feature-id-col">Feature ID Column (<code>feature_id_col</code>)</h4>
<p>Column name for feature identifiers (e.g. Modified sequence)</p>
<h4 id="protein-column-protein-col">Protein Column (<code>protein_col</code>)</h4>
<p>Column name containing protein identifiers</p>
<h4 id="apply-log2-transformation-log2-transform">Apply Log2 Transformation (<code>log2_transform</code>)</h4>
<p>Apply log2 transformation to intensities</p>
<h4 id="minimum-peptides-per-protein-filter-min-peptides">Minimum Peptides per Protein (<code>filter_min_peptides</code>)</h4>
<p>Minimum number of peptides required per protein</p>
<h4 id="remove-shared-peptides-remove-shared-peptides">Remove Shared Peptides (<code>remove_shared_peptides</code>)</h4>
<p>Remove peptides mapping to multiple proteins</p>
<h4 id="exclude-conditions-comma-separated-exclude-conditions">Exclude Conditions (comma-separated) (<code>exclude_conditions</code>)</h4>
<p>Comma-separated list of conditions to exclude from analysis (e.g., 'Norm,Empty'). These channels will be filtered out before statistical testing.</p>
<h4 id="remove-norm-channel-remove-norm-channel">Remove 'Norm' Channel (<code>remove_norm_channel</code>)</h4>
<p>Automatically remove samples with condition 'Norm'</p>
<h4 id="column-completeness-threshold-col-filter">Column Completeness Threshold (<code>col_filter</code>)</h4>
<p>Maximum proportion of missing values allowed per sample. Default 0.7 = keep samples with ≥30% valid measurements.</p>
<h4 id="row-completeness-threshold-row-filter">Row Completeness Threshold (<code>row_filter</code>)</h4>
<p>Maximum proportion of missing values allowed per feature. Default 0.7 = keep features with ≥30% valid measurements.</p>
<h4 id="imputation-order-impute-order">Imputation Order (<code>impute_order</code>)</h4>
<p>When to impute missing values relative to normalization. 'after': normalize then impute. 'before': impute then normalize.</p>
<ul>
<li><strong>Options</strong>: <code>before</code>, <code>after</code></li>
</ul>
<h4 id="imputation-method-impute">Imputation Method (<code>impute</code>)</h4>
<p>Imputation method for missing values</p>
<ul>
<li><strong>Options</strong>: <code>none</code>, <code>knn</code>, <code>MinDet</code>, <code>MinProb</code>, <code>min</code>, <code>zero</code>, <code>mixed</code>, <code>nbavg</code>, <code>with</code>, <code>QRILC</code>, <code>MLE</code>, <code>bpca</code></li>
</ul>
<h4 id="normalization-method-normalize-method">Normalization Method (<code>normalize_method</code>)</h4>
<p>Normalization method to apply</p>
<ul>
<li><strong>Options</strong>: <code>none</code>, <code>center.median</code>, <code>center.mean</code>, <code>quantiles</code>, <code>quantiles.robust</code>, <code>vsn</code></li>
</ul>
<h4 id="aggregation-order-aggregation-order">Aggregation Order (<code>aggregation_order</code>)</h4>
<p>When to aggregate peptides to proteins. 'after': normalize/impute peptides then aggregate. 'before': aggregate peptides then normalize proteins.</p>
<ul>
<li><strong>Options</strong>: <code>before</code>, <code>after</code></li>
</ul>
<h4 id="protein-summarization-method-summarization-method">Protein Summarization Method (<code>summarization_method</code>)</h4>
<p>Method for combining feature intensities. 'robust': Tukey's median polish. 'median': median. 'mean': arithmetic mean. 'sum': sum.</p>
<ul>
<li><strong>Options</strong>: <code>robust</code>, <code>sum</code>, <code>mean</code>, <code>median</code></li>
</ul>
<h4 id="model-run-effect-model-run-effect">Model Run Effect (<code>model_run_effect</code>)</h4>
<p>Include TMT run as random effect in the model. Requires 'Run' column in annotation file.</p>
<h4 id="use-robust-regression-robust-regression">Use Robust Regression (<code>robust_regression</code>)</h4>
<p>Use robust M-estimation for model fitting</p>
<h4 id="ridge-penalty-ridge-penalty">Ridge Penalty (<code>ridge_penalty</code>)</h4>
<p>L2 regularization penalty for model fitting. 0 = no penalty.</p>
<h4 id="maximum-iterations-max-iterations">Maximum Iterations (<code>max_iterations</code>)</h4>
<p>Maximum iterations for robust regression convergence.</p>
<h4 id="p-value-adjustment-method-adjust-method">P-value Adjustment Method (<code>adjust_method</code>)</h4>
<p>Method for multiple testing correction</p>
<ul>
<li><strong>Options</strong>: <code>BH</code>, <code>bonferroni</code>, <code>holm</code>, <code>hochberg</code>, <code>BY</code>, <code>none</code></li>
</ul>
<h4 id="significance-level-alpha">Significance Level (<code>alpha</code>)</h4>
<p>Adjusted p-value threshold for significance.</p>
<h4 id="log2-fold-change-threshold-lfc-threshold">Log2 Fold Change Threshold (<code>lfc_threshold</code>)</h4>
<p>Minimum absolute log2 fold-change threshold. 0 = no fold-change filter.</p>
