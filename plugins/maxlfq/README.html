<p><strong>ID</strong>: <code>maxlfq</code><br>
<strong>Version</strong>: 1.0.0<br>
<strong>Category</strong>: preprocessing<br>
<strong>Author</strong>: CauldronGO Team</p>
<h2 id="description">Description</h2>
<p>Label-free quantification using MaxLFQ algorithm for protein-level quantification from peptide intensities</p>
<h2 id="runtime">Runtime</h2>
<ul>
<li><strong>Type</strong>: <code>r</code></li>
<li><strong>Script</strong>: <code>maxlfq.R</code></li>
</ul>
<h2 id="inputs">Inputs</h2>
<table>
<thead>
<tr>
<th>Name</th>
<th>Label</th>
<th>Type</th>
<th>Required</th>
<th>Default</th>
<th>Visibility</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>input_file</code></td>
<td>Input File</td>
<td>file</td>
<td>Yes</td>
<td>-</td>
<td>Always visible</td>
</tr>
<tr>
<td><code>protein_col</code></td>
<td>Protein Column</td>
<td>text</td>
<td>Yes</td>
<td>Protein.Group</td>
<td>Always visible</td>
</tr>
<tr>
<td><code>peptide_col</code></td>
<td>Peptide Column</td>
<td>text</td>
<td>Yes</td>
<td>Precursor.Id</td>
<td>Always visible</td>
</tr>
<tr>

<td>Yes</td>
<td>-</td>
<td>Always visible</td>
</tr>
<tr>

<td>Sample Annotation File</td>
<td>file</td>

<td>-</td>
<td>Always visible</td>
</tr>
<tr>

<td>Data Completeness</td>
<td>number (min: 0, max: 1, step: 0)</td>

<h3 id="input-details">Input Details</h3>
<h4 id="input-file-input-file">Input File (<code>input_file</code>)</h4>
<p>Peptide intensity data file</p>
<h4 id="protein-column-protein-col">Protein Column (<code>protein_col</code>)</h4>
<p>Column name containing protein identifiers</p>
<h4 id="peptide-column-peptide-col">Peptide Column (<code>peptide_col</code>)</h4>
<p>Column name containing peptide identifiers</p>
<h4 id="sample-columns-sample-cols">Sample Columns (<code>sample_cols</code>)</h4>
<p>Columns containing sample intensities</p>
<ul>
<li><strong>Column Source</strong>: <code>input_file</code></li>
</ul>
<h4 id="sample-annotation-file-annotation-file">Sample Annotation File (<code>annotation_file</code>)</h4>
<p>Optional annotation file with Sample and Condition columns for grouping in plots</p>
<h4 id="data-completeness-data-completeness">Data Completeness (<code>data_completeness</code>)</h4>
<p>Minimum fraction of samples with valid values (0-1). Higher values = less memory usage. Use 0.7-0.9 for large datasets.</p>
<h4 id="use-log2-transform-use-log2">Use Log2 Transform (<code>use_log2</code>)</h4>
<p>Apply log2 transformation to peptide intensities before MaxLFQ. When enabled, MaxLFQ works in log2 space and outputs log2 values. When disabled, works in raw intensity space.</p>
<h4 id="maximum-cores-max-cores">Maximum Cores (<code>max_cores</code>)</h4>
<p>Maximum number of CPU cores to use (-1 = use all available cores minus 1, 0 = use all cores)</p>
<h2 id="outputs">Outputs</h2>
<table>
<thead>
<tr>
<th>Name</th>

<th>Type</th>
<th>Format</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>

<td><code>maxlfq.data.txt</code></td>
<td>data</td>
<td>tsv</td>
<td>MaxLFQ normalized protein intensities</td>
</tr>
</tbody>
</table>
<h2 id="sample-annotation">Sample Annotation</h2>
<p>This plugin supports sample annotation:</p>
<ul>
<li><strong>Samples From</strong>: <code>sample_cols</code></li>
<li><strong>Annotation File</strong>: <code>annotation_file</code></li>
</ul>
<h2 id="visualizations">Visualizations</h2>
<p>This plugin generates 2 plot(s):</p>
<h3 id="before-normalization-boxplot-before">Before Normalization (<code>boxplot_before</code>)</h3>
<p>Protein intensities before normalization grouped by condition</p>
<ul>
<li><strong>Type</strong>: image-grid</li>
<li><strong>Data Source</strong>: <code>maxlfq_results</code></li>
<li><strong>Default</strong>: Yes</li>
<li><strong>Image Pattern</strong>: <code>boxplot_before_normalization.svg</code></li>
<li><strong>Pattern Type</strong>: exact</li>
</ul>
<h3 id="after-normalization-boxplot-after">After Normalization (<code>boxplot_after</code>)</h3>
<p>Protein intensities after normalization grouped by condition</p>
<ul>
<li><strong>Type</strong>: image-grid</li>
<li><strong>Data Source</strong>: <code>maxlfq_results</code></li>
<li><strong>Image Pattern</strong>: <code>boxplot_after_normalization.svg</code></li>
<li><strong>Pattern Type</strong>: exact</li>
</ul>

<ul>

<li>reshape2</li>

</ul>
</li>
</ul>
