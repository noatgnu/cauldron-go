plugin:
  id: "maxlfq"
  name: "MaxLFQ Normalization"
  description: "Label-free quantification using MaxLFQ algorithm for protein-level quantification from peptide intensities"
  version: "1.0.0"
  author: "CauldronGO Team"
  category: "preprocessing"
  icon: "insights"

runtime:
  type: "r"
  script: "maxlfq.R"

inputs:
  - name: "input_file"
    label: "Input File"
    type: "file"
    required: true
    accept: ".csv,.tsv,.txt"
    description: "Peptide intensity data file"

  - name: "protein_col"
    label: "Protein Column"
    type: "text"
    required: true
    default: "Protein.Group"
    description: "Column name containing protein identifiers"

  - name: "peptide_col"
    label: "Peptide Column"
    type: "text"
    required: true
    default: "Precursor.Id"
    description: "Column name containing peptide identifiers"

  - name: "sample_cols"
    label: "Sample Columns"
    type: "column-selector"
    required: true
    multiple: true
    sourceFile: "input_file"
    description: "Columns containing sample intensities"

  - name: "annotation_file"
    label: "Sample Annotation File"
    type: "file"
    required: false
    accept: ".csv,.tsv,.txt"
    description: "Optional annotation file with Sample and Condition columns for grouping in plots"

  - name: "data_completeness"
    label: "Data Completeness"
    type: "number"
    default: 0.7
    min: 0
    max: 1
    step: 0.1
    description: "Minimum fraction of samples with valid values (0-1). Higher values = less memory usage. Use 0.7-0.9 for large datasets."

  - name: "use_log2"
    label: "Use Log2 Transform"
    type: "boolean"
    default: false
    description: "Apply log2 transformation to peptide intensities before MaxLFQ. When enabled, MaxLFQ works in log2 space and outputs log2 values. When disabled, works in raw intensity space."

  - name: "max_cores"
    label: "Maximum Cores"
    type: "number"
    default: -1
    min: -1
    max: 128
    step: 1
    description: "Maximum number of CPU cores to use (-1 = use all available cores minus 1, 0 = use all cores)"

outputs:
  - name: "maxlfq_results"
    path: "maxlfq.data.txt"
    type: "data"
    description: "MaxLFQ normalized protein intensities"
    format: "tsv"

annotation:
  samplesFrom: "sample_cols"
  annotationFile: "annotation_file"

plots:
  - id: "boxplot_before"
    type: "image-grid"
    title: "Before Normalization"
    description: "Protein intensities before normalization grouped by condition"
    dataSource: "maxlfq_results"
    default: true
    config:
      imagePattern: "boxplot_before_normalization.svg"
      imagePatternType: "exact"
  - id: "boxplot_after"
    type: "image-grid"
    title: "After Normalization"
    description: "Protein intensities after normalization grouped by condition"
    dataSource: "maxlfq_results"
    config:
      imagePattern: "boxplot_after_normalization.svg"
      imagePatternType: "exact"

execution:
  argsMapping:
    input_file: "--file_path"
    protein_col: "--protein_col"
    peptide_col: "--peptide_col"
    sample_cols:
      flag: "--sample_cols"
      transform: "comma-join"
    annotation_file: "--annotation_file"
    data_completeness: "--data_completeness"
    use_log2:
      flag: "--use_log2"
      when: "true"
      value: "true"
    max_cores: "--max_cores"

  outputDir: "--output_folder"

  requirements:
    r: ">=4.0"
    rPackagesFile: "r-packages.txt"

example:
  enabled: true
  values:
    input_file: "diann/Reports.pr_matrix.tsv"
    protein_col: "Protein.Group"
    peptide_col: "Precursor.Id"
    sample_cols_source: "diann/Reports.pr_matrix.tsv"
    sample_cols:
      - 'C:\Raja\DIA-NN searches\June 2022\LT-CBQCA-Test_DIA\RN-DS_220106_BCA_LT-IP_01.raw'
      - 'C:\Raja\DIA-NN searches\June 2022\LT-CBQCA-Test_DIA\RN-DS_220106_BCA_LT-IP_02.raw'
      - 'C:\Raja\DIA-NN searches\June 2022\LT-CBQCA-Test_DIA\RN-DS_220106_BCA_LT-IP_03.raw'
      - 'C:\Raja\DIA-NN searches\June 2022\LT-CBQCA-Test_DIA\RN-DS_220106_BCA_LT-MockIP_01.raw'
      - 'C:\Raja\DIA-NN searches\June 2022\LT-CBQCA-Test_DIA\RN-DS_220106_BCA_LT-MockIP_02.raw'
      - 'C:\Raja\DIA-NN searches\June 2022\LT-CBQCA-Test_DIA\RN-DS_220106_BCA_LT-MockIP_03.raw'
    annotation_file: "diann/annotation.txt"
    data_completeness: 0.7
    use_log2: true
