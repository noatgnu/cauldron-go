plugin:
  id: "spectronaut-msstats-ptm-tmt"
  name: "Spectronaut MSstatsPTM TMT Analysis"
  description: "Statistical analysis of TMT-labeled post-translational modifications from Spectronaut data using MSstatsPTM package"
  version: "1.0.0"
  author: "CauldronGO Team"
  category: "statistics"
  subcategory: "msstats"
  icon: "science"

runtime:
  type: "r"
  script: "msstatsptm_tmt.R"

inputs:
  - name: "input_file"
    label: "PTM Report File"
    type: "file"
    required: true
    accept: ".tsv,.txt,.csv"
    description: "Spectronaut PTM report file (usually *_Report.txt or *_Report.csv)"

  - name: "annotation_file"
    label: "PTM Annotation File"
    type: "file"
    required: true
    accept: ".csv,.tsv,.txt"
    disableAnnotationManagement: true
    description: "TMT annotation file for PTM data (columns: Run, Channel, Condition, Mixture, TechRepMixture, Fraction, BioReplicate)"
    tableColumns:
      - name: "Run"
        label: "Run"
        type: "text"
        required: true
        description: "Run identifier from Spectronaut"
      - name: "Channel"
        label: "Channel"
        type: "text"
        required: true
        description: "TMT channel (e.g., channel1, channel2, ..., channel16)"
      - name: "Condition"
        label: "Condition"
        type: "text"
        required: true
        description: "Experimental condition/group name"
      - name: "Mixture"
        label: "Mixture"
        type: "text"
        required: true
        description: "TMT plex identifier (e.g., mixture1)"
      - name: "TechRepMixture"
        label: "TechRepMixture"
        type: "text"
        required: true
        description: "Technical replicate mixture identifier (usually 1)"
      - name: "Fraction"
        label: "Fraction"
        type: "text"
        required: true
        description: "Fraction number identifying which fraction this run represents"
      - name: "BioReplicate"
        label: "BioReplicate"
        type: "text"
        required: true
        description: "Biological replicate number"

  - name: "input_protein_file"
    label: "Protein Report File"
    type: "file"
    required: false
    accept: ".tsv,.txt,.csv"
    description: "Spectronaut report file for protein-level data (optional but recommended)"

  - name: "annotation_protein_file"
    label: "Protein Annotation File"
    type: "file"
    required: false
    accept: ".csv,.tsv,.txt"
    disableAnnotationManagement: true
    description: "TMT annotation file for protein data (same structure as PTM annotation)"
    tableColumns:
      - name: "Run"
        label: "Run"
        type: "text"
        required: true
        description: "Run identifier from Spectronaut"
      - name: "Channel"
        label: "Channel"
        type: "text"
        required: true
        description: "TMT channel (e.g., channel1, channel2, ..., channel16)"
      - name: "Condition"
        label: "Condition"
        type: "text"
        required: true
        description: "Experimental condition/group name"
      - name: "Mixture"
        label: "Mixture"
        type: "text"
        required: true
        description: "TMT plex identifier (e.g., mixture1)"
      - name: "TechRepMixture"
        label: "TechRepMixture"
        type: "text"
        required: true
        description: "Technical replicate mixture identifier (usually 1)"
      - name: "Fraction"
        label: "Fraction"
        type: "text"
        required: true
        description: "Fraction number identifying which fraction this run represents"
      - name: "BioReplicate"
        label: "BioReplicate"
        type: "text"
        required: true
        description: "Biological replicate number"

  - name: "fasta_file"
    label: "FASTA File"
    type: "file"
    required: false
    accept: ".fasta,.fa"
    description: "FASTA file for protein database (recommended for accurate PTM site localization)"

  - name: "fasta_protein_name"
    label: "FASTA Protein Name Column"
    type: "text"
    required: false
    default: "uniprot_iso"
    description: "Column name in FASTA for protein identifier"

  - name: "mod_id"
    label: "PTM Modification ID"
    type: "text"
    required: false
    default: "\\[Phospho \\(STY\\)\\]"
    description: "Modification identifier pattern for PTMs (e.g., \\[Phospho \\(STY\\)\\], \\[Acetyl \\(K\\)\\])"

  - name: "use_unmod_peptides"
    label: "Use Unmodified Peptides from PTM File"
    type: "boolean"
    required: false
    default: false
    description: "Extract unmodified peptides from PTM file for protein quantification (if no separate protein file provided)"

  - name: "remove_other_mods"
    label: "Remove Other Modifications"
    type: "boolean"
    required: false
    default: true
    description: "Remove peptides with modifications other than the target PTM"

  - name: "intensity"
    label: "Intensity Column"
    type: "select"
    required: false
    default: "PeakArea"
    options:
      - "PeakArea"
      - "NormalizedPeakArea"
      - "TotalPeakArea"
    description: "Which intensity column to use from Spectronaut output"

  - name: "filter_with_Qvalue"
    label: "Filter with Q-value"
    type: "boolean"
    required: false
    default: false
    description: "Filter features by Q-value threshold"

  - name: "qvalue_cutoff"
    label: "Q-value Cutoff"
    type: "number"
    required: false
    default: 0.01
    min: 0
    max: 1
    step: 0.001
    description: "Q-value threshold for filtering (only used if Filter with Q-value is enabled)"

  - name: "useUniquePeptide"
    label: "Use Unique Peptides Only"
    type: "boolean"
    required: false
    default: true
    description: "Use only unique peptides for protein quantification"

  - name: "removeFewMeasurements"
    label: "Remove Few Measurements"
    type: "boolean"
    required: false
    default: true
    description: "Remove features with too few measurements"

  - name: "removeProtein_with1Feature"
    label: "Remove Proteins with Single Feature"
    type: "boolean"
    required: false
    default: false
    description: "Remove proteins identified by only one feature"

  - name: "summarization_method"
    label: "Summarization Method"
    type: "select"
    required: false
    default: "msstats"
    options:
      - "msstats"
      - "MedianPolish"
      - "Median"
    description: "Method for summarizing TMT reporter intensities"

  - name: "global_norm"
    label: "Global Normalization (Protein)"
    type: "boolean"
    required: false
    default: true
    description: "Apply global normalization to protein data"

  - name: "global_norm_PTM"
    label: "Global Normalization (PTM)"
    type: "boolean"
    required: false
    default: true
    description: "Apply global normalization to PTM data"

  - name: "reference_norm"
    label: "Reference Channel Normalization (Protein)"
    type: "boolean"
    required: false
    default: true
    description: "Apply reference channel normalization to protein data (TMT-specific)"

  - name: "reference_norm_PTM"
    label: "Reference Channel Normalization (PTM)"
    type: "boolean"
    required: false
    default: true
    description: "Apply reference channel normalization to PTM data (TMT-specific)"

  - name: "remove_norm_channel"
    label: "Remove Normalization Channel"
    type: "boolean"
    required: false
    default: true
    description: "Remove normalization channel from final output"

  - name: "remove_empty_channel"
    label: "Remove Empty Channels"
    type: "boolean"
    required: false
    default: true
    description: "Remove empty TMT channels from output"

  - name: "MBimpute"
    label: "MBimpute for Protein"
    type: "boolean"
    required: false
    default: true
    description: "Use model-based imputation for missing values in protein data"

  - name: "MBimpute_PTM"
    label: "MBimpute for PTM"
    type: "boolean"
    required: false
    default: true
    description: "Use model-based imputation for missing values in PTM data"

  - name: "maxQuantileforCensored"
    label: "Max Quantile for Censored"
    type: "number"
    required: false
    default: null
    min: 0.9
    max: 1
    step: 0.001
    description: "Maximum quantile for determining censored missing values (leave empty for automatic)"

  - name: "comparison_matrix_file"
    label: "Comparison Matrix File"
    type: "file"
    required: false
    accept: ".csv,.tsv,.txt"
    description: "Custom comparison matrix file (if not provided, all pairwise comparisons will be performed)"

  - name: "moderated"
    label: "Moderated T-Statistic"
    type: "boolean"
    required: false
    default: false
    description: "Use moderated t-statistic (empirical Bayes, not typically used for TMT)"

  - name: "adj_method"
    label: "Multiple Testing Adjustment"
    type: "select"
    required: false
    default: "BH"
    options:
      - "BH"
      - "bonferroni"
      - "holm"
      - "hochberg"
      - "BY"
      - "none"
    description: "Method for multiple testing correction"

  - name: "log_base"
    label: "Log Base for Fold Change"
    type: "select"
    required: false
    default: "2"
    options:
      - "2"
      - "10"
    description: "Base of logarithm for reporting fold changes"

  - name: "save_fitted_models"
    label: "Save Fitted Models"
    type: "boolean"
    required: false
    default: false
    description: "Save fitted statistical models in the output (can be memory intensive)"

outputs:
  - name: "group_comparison_ptm"
    path: "group_comparison_ptm.txt"
    type: "data"
    description: "PTM-level differential analysis results"
    format: "tsv"

  - name: "group_comparison_protein"
    path: "group_comparison_protein.txt"
    type: "data"
    description: "Protein-level differential analysis results"
    format: "tsv"

  - name: "group_comparison_adjusted"
    path: "group_comparison_adjusted.txt"
    type: "data"
    description: "PTM results adjusted for protein abundance changes (recommended for interpretation)"
    format: "tsv"

  - name: "peptide_intensities_wide"
    path: "peptide_intensities_wide.txt"
    type: "data"
    description: "Peptide-level summarized intensities in wide format (can be joined with PTM and adjusted results)"
    format: "tsv"

  - name: "protein_intensities_wide"
    path: "protein_intensities_wide.txt"
    type: "data"
    description: "Protein-level summarized intensities in wide format (can be joined with protein results)"
    format: "tsv"

execution:
  argsMapping:
    input_file: "--input_file"
    annotation_file: "--annotation_file"
    input_protein_file: "--input_protein_file"
    annotation_protein_file: "--annotation_protein_file"
    fasta_file: "--fasta_file"
    fasta_protein_name: "--fasta_protein_name"
    mod_id: "--mod_id"
    use_unmod_peptides:
      flag: "--use_unmod_peptides"
      when: "true"
      value: "true"
    remove_other_mods:
      flag: "--remove_other_mods"
      when: "true"
      value: "true"
    intensity: "--intensity"
    filter_with_Qvalue:
      flag: "--filter_with_Qvalue"
      when: "true"
      value: "true"
    qvalue_cutoff: "--qvalue_cutoff"
    useUniquePeptide:
      flag: "--useUniquePeptide"
      when: "true"
      value: "true"
    removeFewMeasurements:
      flag: "--removeFewMeasurements"
      when: "true"
      value: "true"
    removeProtein_with1Feature:
      flag: "--removeProtein_with1Feature"
      when: "true"
      value: "true"
    summarization_method: "--summarization_method"
    global_norm:
      flag: "--global_norm"
      when: "true"
      value: "true"
    global_norm_PTM:
      flag: "--global_norm_PTM"
      when: "true"
      value: "true"
    reference_norm:
      flag: "--reference_norm"
      when: "true"
      value: "true"
    reference_norm_PTM:
      flag: "--reference_norm_PTM"
      when: "true"
      value: "true"
    remove_norm_channel:
      flag: "--remove_norm_channel"
      when: "true"
      value: "true"
    remove_empty_channel:
      flag: "--remove_empty_channel"
      when: "true"
      value: "true"
    MBimpute:
      flag: "--MBimpute"
      when: "true"
      value: "true"
    MBimpute_PTM:
      flag: "--MBimpute_PTM"
      when: "true"
      value: "true"
    maxQuantileforCensored: "--maxQuantileforCensored"
    comparison_matrix_file: "--comparison_matrix_file"
    moderated:
      flag: "--moderated"
      when: "true"
      value: "true"
    adj_method: "--adj_method"
    log_base: "--log_base"
    save_fitted_models:
      flag: "--save_fitted_models"
      when: "true"
      value: "true"

  outputDir: "--output_folder"

  requirements:
    r: ">=4.0"
    packages:
      - "MSstatsPTM"
      - "MSstatsTMT"
      - "tidyverse"

example:
  enabled: false
