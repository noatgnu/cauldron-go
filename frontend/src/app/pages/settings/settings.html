<div class="settings-container">
  <div class="section-header">
    <h1>
      <mat-icon>{{ getSectionIcon() }}</mat-icon>
      {{ getSectionTitle() }}
    </h1>
  </div>

  <div class="settings-content">
    @switch (currentSection()) {
      @case ('general') {
        <app-settings-general />
      }
      @case ('python') {
        <app-settings-python />
      }
      @case ('r') {
        <app-settings-r />
      }
      @case ('registry') {
        <app-settings-registry />
      }
      @case ('env') {
        <app-settings-env />
      }
    }
  </div>
</div>
