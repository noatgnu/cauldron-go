<div class="settings-container">
  <div class="section-header">
    <button mat-icon-button (click)="goBack()" class="back-button" aria-label="Go back">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>
      <mat-icon>{{ getSectionIcon() }}</mat-icon>
      {{ getSectionTitle() }}
    </h1>
  </div>

  <div class="settings-content">
    @switch (currentSection()) {
      @case ('general') {
        <app-settings-general />
      }
      @case ('appearance') {
        <app-settings-appearance />
      }
      @case ('accessibility') {
        <app-settings-accessibility />
      }
      @case ('python') {
        <app-settings-python />
      }
      @case ('r') {
        <app-settings-r />
      }
      @case ('registry') {
        <app-settings-registry />
      }
      @case ('env') {
        <app-settings-env />
      }
      @case ('git') {
        <app-settings-git />
      }
      @case ('backup') {
        <app-settings-backup />
      }
    }
  </div>
</div>
